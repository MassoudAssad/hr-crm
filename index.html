function CvZoomViewer({url}){
  const [zoom,setZoom]=React.useState(1);
  const [pos,setPos]=React.useState({x:0,y:0});
  const [dragging,setDragging]=React.useState(false);
  const dragStart=React.useRef(null);
  const containerRef=React.useRef(null);

  // גלגל = זום
  const onWheel=React.useCallback((e)=>{
    e.preventDefault();
    const delta=e.deltaY>0?-0.12:0.12;
    setZoom(z=>Math.min(4,Math.max(0.4,parseFloat((z+delta).toFixed(2)))));
  },[]);

  React.useEffect(()=>{
    const el=containerRef.current;
    if(!el) return;
    el.addEventListener('wheel',onWheel,{passive:false});
    return()=>el.removeEventListener('wheel',onWheel);
  },[onWheel]);

  // גרירה עם כפתור ימין
  const onMouseDown=(e)=>{
    if(e.button!==2) return;
    e.preventDefault();
    setDragging(true);
    dragStart.current={mx:e.clientX,my:e.clientY,px:pos.x,py:pos.y};
  };
  const onMouseMove=(e)=>{
    if(!dragging||!dragStart.current) return;
    setPos({x:dragStart.current.px+(e.clientX-dragStart.current.mx),y:dragStart.current.py+(e.clientY-dragStart.current.my)});
  };
  const onMouseUp=()=>setDragging(false);
  const onContextMenu=(e)=>e.preventDefault();

  return <div ref={containerRef}
    onMouseDown={onMouseDown} onMouseMove={onMouseMove} onMouseUp={onMouseUp} onMouseLeave={onMouseUp} onContextMenu={onContextMenu}
    style={{overflow:'hidden',borderRadius:8,border:'1px solid #e5e7eb',height:'calc(94vh - 210px)',minHeight:480,position:'relative',background:'#525659',cursor:dragging?'grabbing':'default',userSelect:'none'}}>

    {/* PDF */}
    <div style={{position:'absolute',inset:0,display:'flex',alignItems:'flex-start',justifyContent:'center',overflow:'hidden'}}>
      <div style={{transform:`translate(${pos.x}px,${pos.y}px) scale(${zoom})`,transformOrigin:'top center',transition:dragging?'none':'transform .1s',willChange:'transform'}}>
        <iframe src={url+'#toolbar=0&navpanes=0&scrollbar=0&view=FitH'} style={{width:540,height:'calc(94vh - 180px)',minHeight:520,border:'none',display:'block',pointerEvents:'none'}} title="CV"/>
      </div>
    </div>

    {/* Overlay שקוף לתפיסת אירועים */}
    <div style={{position:'absolute',inset:0,zIndex:5,background:'transparent'}}
      onWheel={onWheel}
      onMouseDown={onMouseDown} onMouseMove={onMouseMove} onMouseUp={onMouseUp} onMouseLeave={onMouseUp} onContextMenu={onContextMenu}/>

    {/* פס כלים */}
    <div style={{display:'flex',justifyContent:'center',alignItems:'center',gap:6,padding:'5px 12px',background:'rgba(0,0,0,0.6)',position:'absolute',bottom:10,left:'50%',transform:'translateX(-50%)',borderRadius:20,zIndex:10,backdropFilter:'blur(4px)'}}>
      <button onClick={()=>setZoom(z=>Math.max(0.4,parseFloat((z-0.15).toFixed(2))))}
        style={{background:'rgba(255,255,255,0.2)',border:'none',color:'white',width:28,height:28,borderRadius:14,cursor:'pointer',fontSize:18,display:'flex',alignItems:'center',justifyContent:'center'}}>−</button>
      <span style={{color:'white',fontSize:12,fontWeight:700,minWidth:42,textAlign:'center'}}>{Math.round(zoom*100)}%</span>
      <button onClick={()=>setZoom(z=>Math.min(4,parseFloat((z+0.15).toFixed(2))))}
        style={{background:'rgba(255,255,255,0.2)',border:'none',color:'white',width:28,height:28,borderRadius:14,cursor:'pointer',fontSize:18,display:'flex',alignItems:'center',justifyContent:'center'}}>+</button>
      <button onClick={()=>{setZoom(1);setPos({x:0,y:0});}}
        style={{background:'rgba(255,255,255,0.15)',border:'none',color:'white',borderRadius:10,cursor:'pointer',fontSize:11,padding:'3px 10px',fontFamily:'Rubik',marginRight:4}}>איפוס</button>
      <span style={{color:'rgba(255,255,255,0.5)',fontSize:10,marginRight:4}}>כפתור ימין = הזזה</span>
    </div>
  </div>;
}

function Candidates({data,setData,navTick}){
  const [search,setSearch]=React.useState('');
  const [stFilter,setStFilter]=React.useState('הכל');
  const [modal,setModal]=React.useState(null);
  const [form,setForm]=React.useState({});
  const [detail,setDetail]=React.useState(null);
  const [detailForm,setDetailForm]=React.useState(null); // editable copy of detail
  const skipNavTick=React.useRef(true);
  React.useEffect(()=>{
    if(skipNavTick.current){skipNavTick.current=false;return;}
    setDetail(null);setDetailForm(null);
  },[navTick]);
  const [msgTarget,setMsgTarget]=React.useState(null);
  const [jobSearch,setJobSearch]=React.useState('');
  const [showJobPicker,setShowJobPicker]=React.useState(false);
  const [cvDrag,setCvDrag]=React.useState(false);
  const [cvParsing,setCvParsing]=React.useState(false);
  const [aiFields,setAiFields]=React.useState({});
  const [dupWarn,setDupWarn]=React.useState(null);
  const [cvBlobUrl,setCvBlobUrl]=React.useState('');
  const [cvPreviewHtml,setCvPreviewHtml]=React.useState('');

  const checkDupId=(idNum,currentId)=>{
    if(!idNum||!idNum.trim())return null;
    return data.candidates.find(c=>c.idNumber&&c.idNumber.trim()===idNum.trim()&&c.id!==currentId)||null;
  };

  // ── CV Parsing functions ──
  const extractTextFromFile=async(file)=>{
    const ext=file.name.split('.').pop().toLowerCase();
    if(ext==='pdf'){
      const pdfjsLib=window.pdfjsLib;
      if(!pdfjsLib){console.warn('PDF.js not loaded');return '';}
      pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const ab=await file.arrayBuffer();
      const pdf=await pdfjsLib.getDocument({data:new Uint8Array(ab)}).promise;
      let text='';
      for(let i=1;i<=Math.min(pdf.numPages,5);i++){
        const page=await pdf.getPage(i);
        const tc=await page.getTextContent();
        text+=tc.items.map(s=>s.str).join(' ')+'\n';
      }
      return text;
    } else if(ext==='docx'||ext==='doc'){
      const ab=await file.arrayBuffer();
      const result=await mammoth.extractRawText({arrayBuffer:ab});
      return result.value;
    } else if(['jpg','jpeg','png','webp','gif'].includes(ext)){
      return new Promise(resolve=>{
        const reader=new FileReader();
        reader.onload=e=>resolve({type:'image',base64:e.target.result.split(',')[1],mediaType:file.type||'image/jpeg'});
        reader.readAsDataURL(file);
      });
    }
    return '';
  };

  const parseWithAI=async(input)=>{
    const domains=(data.jobDomains||[]).map(d=>d.name).join(', ');
    const prompt='אתה מנתח קורות חיים. חלץ את המידע הבא מהטקסט ותחזיר JSON בלבד ללא הסבר:\n{"name":"שם מלא","idNumber":"תעודת זהות מספרים בלבד","phone":"טלפון","email":"אימייל","city":"עיר","birthDate":"YYYY-MM-DD","gender":"זכר/נקבה/אחר","maritalStatus":"רווק/ה/נשוי/אה/גרוש/ה/אלמן/ה","drivingLicense":"יש/אין","education":"השכלה","experience":"ניסיון","domain":"תחום מתוך: '+domains+'","role":"תפקיד","minSalary":"שכר מינימום מספר בלבד","notes":"הערות","langHebrew":"שליטה בעברית: שפת אם / טובה מאוד / טובה / בסיסית — ריק אם לא מוזכר","langEnglish":"שליטה באנגלית: שפת אם / טובה מאוד / טובה / בסיסית — ריק אם לא מוזכר","langArabic":"שליטה בערבית: שפת אם / טובה מאוד / טובה / בסיסית — ריק אם לא מוזכר","langRussian":"שליטה ברוסית: שפת אם / טובה מאוד / טובה / בסיסית — ריק אם לא מוזכר","langAmharic":"שליטה באמהרית: שפת אם / טובה מאוד / טובה / בסיסית — ריק אם לא מוזכר","langSpanish":"שליטה בספרדית: שפת אם / טובה מאוד / טובה / בסיסית — ריק אם לא מוזכר","langFrench":"שליטה בצרפתית: שפת אם / טובה מאוד / טובה / בסיסית — ריק אם לא מוזכר"}\nהוראות שפות: חלץ רק שפות שמוזכרות במפורש. אל תניח עברית כשפת אם אלא אם כתוב. אם שדה לא נמצא השאר ריק.';
    const isImage=typeof input==='object'&&input.type==='image';
    const messageContent=isImage
      ?[{type:'image',source:{type:'base64',media_type:input.mediaType,data:input.base64}},{type:'text',text:prompt+'\nנתח את תמונת קורות החיים.'}]
      :prompt+'\n טקסט:\n'+input.slice(0,4000);
    const payload={model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:messageContent}]};
    let res;
    if(CLAUDE_API_KEY){
      res=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':CLAUDE_API_KEY,'anthropic-version':'2023-06-01'},
        body:JSON.stringify(payload)
      });
    } else {
      res=await fetch('/.netlify/functions/claude-proxy',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(payload)
      });
    }
    if(!res.ok){const err=await res.text();throw new Error('API '+res.status+': '+err.slice(0,200));}
    const data2=await res.json();
    const raw=data2?.content?.[0]?.text||'{}';
    try{return JSON.parse(raw.replace(/```json|```/g,'').trim());}
    catch{return {};}
  };

  const applyParsedFields=(parsed)=>{
    const filled={};const updates={};
    const fields=['name','idNumber','phone','email','city','birthDate','gender','maritalStatus','drivingLicense','education','experience','domain','role','minSalary','notes','langHebrew','langEnglish','langArabic','langRussian','langAmharic','langSpanish','langFrench'];
    fields.forEach(k=>{if(parsed[k]&&parsed[k].trim&&parsed[k].trim()){updates[k]=parsed[k].trim();filled[k]=true;}});
    if(Object.keys(updates).length>0){
      setForm(f=>({...f,...updates}));
      setAiFields(filled);
      setTimeout(()=>setAiFields({}),3500);
      if(updates.idNumber){
        setForm(f=>{
          const dup=checkDupId(updates.idNumber,f.id);
          setDupWarn(dup||null);
          return f;
        });
      }
    }
  };

  const runParseOnExisting=async()=>{
    if(!form._cvFile)return;
    setCvParsing(true);
    try{
      const result=await extractTextFromFile(form._cvFile);
      const isImage=typeof result==='object'&&result.type==='image';
      if(isImage||result.trim().length>50){const parsed=await parseWithAI(result);applyParsedFields(parsed);}
      else{showToast('לא נמצא טקסט בקובץ לפיענוח','error');}
    }catch(err){
      console.warn('CV parsing failed:',err);
      showToast('שגיאה בפיענוח קורות חיים:\n'+err.message+'\n\nוודא שה-CLAUDE_API_KEY מוגדר בקוד (שורה 140).','error');
    }
    finally{setCvParsing(false);}
  };

  const handleCvDrop=async(e)=>{
    e.preventDefault();setCvDrag(false);
    const file=e.dataTransfer?.files?.[0]||e.target?.files?.[0];
    if(!file)return;
    setForm(f=>({...f,_cvFile:file,_cvName:file.name}));
    setCvBlobUrl(URL.createObjectURL(file));
    const fext=file.name.split('.').pop().toLowerCase();
    if(fext==='docx'||fext==='doc'){
      try{const ab=await file.arrayBuffer();const r=await mammoth.convertToHtml({arrayBuffer:ab});setCvPreviewHtml(r.value);}
      catch{setCvPreviewHtml('');}
    } else {setCvPreviewHtml('');}
    setCvParsing(true);
    try{
      const result=await extractTextFromFile(file);
      const isImage=typeof result==='object'&&result.type==='image';
      if(isImage||result.trim().length>50){const parsed=await parseWithAI(result);applyParsedFields(parsed);}
    }catch(err){console.warn('CV parsing failed:',err);}
    finally{setCvParsing(false);}
    if(modal==='edit'&&form.id){
      const ext=file.name.split('.').pop();
      const fname='cv-'+form.id+'.'+ext;
      const {error}=await sb.storage.from('job-images').upload(fname,file,{upsert:true,contentType:file.type});
      if(!error){const {data:u}=sb.storage.from('job-images').getPublicUrl(fname);setForm(f=>({...f,cv:true,cvUrl:u.publicUrl}));}
    }
  }; // tracks which fields were AI-filled
  const [confirmDel,setConfirmDel]=React.useState(null);

  // open detail card — also init editable form
  const openDetail=(c)=>{setDetail(c);setDetailForm({...c});};
  const dfSet=(field,val)=>setDetailForm(f=>({...f,[field]:val}));
  const saveDetailForm=()=>{
    if(!detailForm) return;
    const entry=mkLog('candidate','updated',detailForm.name);
    setData(d=>({...d,candidates:d.candidates.map(c=>c.id===detailForm.id?detailForm:c),activityLog:[entry,...(d.activityLog||[])].slice(0,50)}));
    setDetail(detailForm);
  };

  const stages=['חדש','בתהליך','ראיון נקבע','השמה מוצלחת'];
  const pendingIds=new Set(data.pendingCandidates||[]);
  const filtered=data.candidates.filter(c=>!pendingIds.has(c.id)&&(c.name.includes(search)||c.role.includes(search)||(c.city||'').includes(search))&&(stFilter==='הכל'||c.status===stFilter));
  const pendingList=(data.pendingCandidates||[]).map(id=>data.candidates.find(c=>c.id===id)).filter(Boolean);
  const openAdd=()=>{setDupWarn(null);setCvBlobUrl('');setCvPreviewHtml('');setForm({name:'',domain:'',role:'',phone:'',email:'',city:'',status:data.defaults?.candidateStatus||'חדש',experience:'',education:'',appliedJobs:[],cv:false,notes:'',idNumber:'',gender:'',maritalStatus:'',drivingLicense:'',mobility:'',birthDate:'',minSalary:'',maxSalary:'',testScore:'',leadSource:'',langHebrew:'',langEnglish:'',langArabic:'',langRussian:'',langSpanish:'',langFrench:'',langAmharic:''});setModal('add');};
  const openEdit=c=>{setDupWarn(null);setCvBlobUrl('');setCvPreviewHtml('');setForm({idNumber:'',gender:'',maritalStatus:'',drivingLicense:'',mobility:'',birthDate:'',minSalary:'',maxSalary:'',testScore:'',leadSource:'',langHebrew:'',langEnglish:'',langArabic:'',langRussian:'',langSpanish:'',langFrench:'',langAmharic:'',...c,appliedJobs:[...c.appliedJobs]});setModal('edit');};
  const [placeModal,setPlaceModal]=React.useState(null); // {candidateId, jobs:[]}

  // פונקציה אטומית: מעדכנת מועמד + משרה בפעולה אחת
  const doPlace=(candidateId, jobId)=>{
    const now=new Date().toISOString();
    const nowDate=now.split('T')[0];
    setData(d=>{
      const cand=d.candidates.find(c=>c.id===candidateId);
      const job=d.jobs.find(j=>j.id===jobId);
      if(!cand||!job) return d;
      const updatedCand=withStatusChange(cand,{...cand,status:'השמה מוצלחת',placedAt:nowDate,placedJobId:jobId});
      const updatedJob=withStatusChange(job,{...job,status:'השמה מוצלחת',placedCandidateId:candidateId,placedCandidateName:cand.name,placedAt:nowDate});
      const log1=mkLog('candidate','updated',cand.name+' → השמה מוצלחת');
      const log2=mkLog('job','updated',job.publishTitle||job.title||job.jobNumber+' → השמה מוצלחת');
      return {...d,
        candidates:d.candidates.map(c=>c.id===candidateId?updatedCand:c),
        jobs:d.jobs.map(j=>j.id===jobId?updatedJob:j),
        activityLog:[log1,log2,...(d.activityLog||[])].slice(0,50)
      };
    });
    setPlaceModal(null);
    if(detail?.id===candidateId) setDetail(prev=>({...prev,status:'השמה מוצלחת',placedAt:nowDate,placedJobId:jobId}));
  };

  const triggerPlace=(cand)=>{
    const jobs=(cand.appliedJobs||[]).map(jid=>data.jobs.find(j=>j.id===jid)).filter(Boolean).filter(j=>j.status!=='השמה מוצלחת');
    if(jobs.length===0){showToast('אין משרות פתוחות מקושרות למועמד זה','info');return;}
    if(jobs.length===1){doPlace(cand.id,jobs[0].id);return;}
    setPlaceModal({candidateId:cand.id,candName:cand.name,jobs});
  };
  const save=()=>{
    const isAdd=modal==='add';
    if(form.idNumber&&form.idNumber.trim()){
      const dup=checkDupId(form.idNumber,form.id);
      if(dup&&!confirm('⚠️ מועמד עם תעודת זהות זהה כבר קיים במערכת:\n\n'+dup.name+'\n\nלהמשיך ולשמור בכל זאת?'))return;
    }
    const entry=mkLog('candidate',isAdd?'added':'updated',form.name);
    if(isAdd){
      const newId='c'+Date.now();
      const candData={...form,id:newId};
      // Upload CV if dragged/selected
      if(form._cvFile){
        const file=form._cvFile;
        const ext=file.name.split('.').pop();
        const fname=`cv-${newId}.${ext}`;
        sb.storage.from('job-images').upload(fname,file,{upsert:true,contentType:file.type}).then(({error})=>{
          if(!error){
            const {data:u}=sb.storage.from('job-images').getPublicUrl(fname);
            setData(d=>({...d,candidates:d.candidates.map(c=>c.id===newId?{...c,cv:true,cvUrl:u.publicUrl}:c)}));
          }
        });
      }
      delete candData._cvFile; delete candData._cvName;
      setData(d=>({...d,candidates:[...d.candidates,withStatusChange(null,candData)],activityLog:[entry,...(d.activityLog||[])].slice(0,50)}));
    } else {
      const prevCand=data.candidates.find(c=>c.id===form.id);
      const statusChanged=prevCand&&prevCand.status!==form.status&&form.status==='השמה מוצלחת';
      const now=new Date().toISOString().split('T')[0];
      const updForm=statusChanged&&!form.placedAt?{...form,placedAt:now}:form;
      setData(d=>{
        let jobs=d.jobs;
        // אם סטטוס השתנה להשמה מוצלחת — סנכרן גם משרה אחת (אם יש placedJobId, אחרת הראשונה)
        if(statusChanged){
          const jobId=updForm.placedJobId||(updForm.appliedJobs||[])[0];
          if(jobId){
            const job=d.jobs.find(j=>j.id===jobId);
            if(job&&job.status!=='השמה מוצלחת'){
              jobs=d.jobs.map(j=>j.id===jobId?withStatusChange(j,{...j,status:'השמה מוצלחת',placedCandidateId:updForm.id,placedCandidateName:updForm.name,placedAt:updForm.placedAt||now}):j);
            }
          }
        }
        return {...d,candidates:d.candidates.map(c=>c.id===updForm.id?withStatusChange(prevCand,updForm):c),jobs,activityLog:[entry,...(d.activityLog||[])].slice(0,50)};
      });
    }
    setModal(null);
  };
  const del=id=>{
    const cand=data.candidates.find(c=>c.id===id);
    setConfirmDel({id,name:cand?.name||id});
  };
  const doDelCandidate=()=>{
    if(!confirmDel)return;
    const {id}=confirmDel;
    const cand=data.candidates.find(c=>c.id===id);
    setData(d=>({...d,candidates:d.candidates.filter(c=>c.id!==id),activityLog:[mkLog('candidate','deleted',cand?.name||id),...(d.activityLog||[])].slice(0,50)}));
    setConfirmDel(null);
    if(detail?.id===id)setDetail(null);
  };

  const approvePendingLocal=(cid)=>{
    const cand=data.candidates.find(c=>c.id===cid);
    setData(d=>({...d,
      pendingCandidates:(d.pendingCandidates||[]).filter(id=>id!==cid),
      candidates:d.candidates.map(c=>c.id===cid?{...c,pendingApproval:false}:c),
      activityLog:[mkLog('pending','approved',cand?.name||cid),...(d.activityLog||[])].slice(0,50)
    }));
  };
  const [confirmReject,setConfirmReject]=React.useState(null);
  const rejectPendingLocal=(cid)=>{
    const cand=data.candidates.find(c=>c.id===cid);
    setConfirmReject({id:cid,name:cand?.name||cid});
  };
  const doRejectPendingLocal=()=>{
    if(!confirmReject)return;
    const {id:cid}=confirmReject;
    const cand=data.candidates.find(c=>c.id===cid);
    setData(d=>({...d,
      pendingCandidates:(d.pendingCandidates||[]).filter(id=>id!==cid),
      candidates:d.candidates.filter(c=>c.id!==cid),
      activityLog:[mkLog('pending','rejected',cand?.name||cid),...(d.activityLog||[])].slice(0,50)
    }));
    setConfirmReject(null);
    if(detail?.id===cid)setDetail(null);
  };

  const [showAdvanced,setShowAdvanced]=React.useState(false);
  const [fDomain,setFDomain]=React.useState('');
  const [fCity,setFCity]=React.useState('');
  const [fCv,setFCv]=React.useState('הכל');
  const [fSource,setFSource]=React.useState('הכל');
  const [fDateFrom,setFDateFrom]=React.useState('');
  const [fDateTo,setFDateTo]=React.useState('');
  const [showExportMenu,setShowExportMenu]=React.useState(false);
  const allCities=[...new Set(data.candidates.map(c=>c.city).filter(Boolean))].sort();
  const allDomains=(data.jobDomains||[]).map(d=>d.name);
  const activeFilters=[fDomain,fCity,fCv!=='הכל'?fCv:'',fSource!=='הכל'?fSource:'',fDateFrom,fDateTo].filter(Boolean).length;
  const clearFilters=()=>{setFDomain('');setFCity('');setFCv('הכל');setFSource('הכל');setFDateFrom('');setFDateTo('');setStFilter('הכל');setSearch('');};
  const filteredAdv=filtered.filter(c=>{
    if(fDomain&&(c.domain||'')!==fDomain)return false;
    if(fCity&&(c.city||'')!==fCity)return false;
    if(fCv==='יש CV'&&!c.cv)return false;
    if(fCv==='אין CV'&&c.cv)return false;
    if(fSource==='דף נחיתה'&&c.source!=='landing_page')return false;
    if(fSource==='ידני'&&c.source==='landing_page')return false;
    if(fDateFrom&&c.appliedAt&&new Date(c.appliedAt)<new Date(fDateFrom))return false;
    if(fDateTo&&c.appliedAt&&new Date(c.appliedAt)>new Date(fDateTo+'T23:59:59'))return false;
    return true;
  });
  const exportCSV=()=>{
    const headers=['שם','טלפון','אימייל','עיר','תחום','תפקיד','ניסיון','השכלה','סטטוס','CV','מקור','תאריך הגשה','משרה'];
    const rows=filteredAdv.map(c=>{
      const job=data.jobs.find(j=>(c.appliedJobs||[]).includes(j.id));
      const vals=[c.name||'',c.phone||'',c.email||'',c.city||'',c.domain||'',c.role||'',c.experience||'',c.education||'',c.status||'',c.cv?'כן':'לא',c.source==='landing_page'?'נחיתה':'ידני',c.appliedAt?new Date(c.appliedAt).toLocaleDateString('he-IL'):'',job?job.publishTitle||job.title:''];
      return vals.map(v=>['"',String(v).split('"').join('""'),'"'].join('')).join(',');
    });
    const csvContent=[headers.join(','),...rows].join('\n');
    const blob=new Blob(['\uFEFF'+csvContent],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='candidates.csv';a.click();
    URL.revokeObjectURL(url);setShowExportMenu(false);
  };
    const exportExcel=()=>{
    const headers=['שם','טלפון','אימייל','עיר','תחום','תפקיד','ניסיון','השכלה','סטטוס','CV','מקור','תאריך הגשה','משרה'];
    const rows=filteredAdv.map(c=>{const job=data.jobs.find(j=>(c.appliedJobs||[]).includes(j.id));return [c.name||'',c.phone||'',c.email||'',c.city||'',c.domain||'',c.role||'',c.experience||'',c.education||'',c.status||'',c.cv?'כן':'לא',c.source==='landing_page'?'דף נחיתה':'ידני',c.appliedAt?new Date(c.appliedAt).toLocaleDateString('he-IL'):'',job?job.publishTitle||job.title:''];});
    const xmlRows=[headers,...rows].map(row=>'<Row>'+row.map(v=>'<Cell><Data ss:Type="String">'+String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</Data></Cell>').join('')+'</Row>').join('');
    const xml='<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="מועמדים"><Table>'+xmlRows+'</Table></Worksheet></Workbook>';
    const a=document.createElement('a');a.href='data:application/vnd.ms-excel;charset=utf-8,'+encodeURIComponent('﻿'+xml);a.download='candidates.xls';a.click();setShowExportMenu(false);
  };
  const selStyle={width:'100%',padding:'8px 10px',border:'1.5px solid #EAE2DF',borderRadius:8,fontFamily:'Rubik',fontSize:15,background:'#FBF8F7',outline:'none'};

  return <div style={{padding:28,background:"#FAF7F6",minHeight:"100%",color:"#2B1F1C"}} className="mobile-pad">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
      <h1 style={{fontSize:37,fontWeight:800,color:'#2B1F1C'}}>👥 מועמדים</h1>
      <div style={{display:'flex',gap:8,alignItems:'center'}}>
        <div style={{position:'relative'}}>
          <button onClick={()=>setShowExportMenu(v=>!v)} style={{display:'flex',alignItems:'center',gap:6,padding:'8px 14px',background:'#FFFFFF',color:'#2B1F1C',border:'2px solid #EAE2DF',borderRadius:8,fontFamily:'Rubik',fontWeight:700,fontSize:15,cursor:'pointer'}}>📥 ייצוא <span style={{fontSize:12}}>▼</span></button>
          {showExportMenu&&<div style={{position:'absolute',top:'calc(100% + 6px)',left:0,background:'#FFFFFF',border:'2px solid #EAE2DF',borderRadius:10,boxShadow:'0 8px 24px rgba(0,0,0,0.1)',zIndex:200,minWidth:180,overflow:'hidden'}}>
            <div style={{padding:'8px 12px',fontSize:13,color:MUT,borderBottom:'1px solid #EAE2DF',fontWeight:700}}>{filteredAdv.length} מועמדים לייצוא</div>
            <button onClick={exportCSV} style={{width:'100%',padding:'11px 16px',background:'none',border:'none',fontFamily:'Rubik',fontSize:16,fontWeight:600,cursor:'pointer',textAlign:'right',color:'#2B1F1C'}} onMouseEnter={e=>e.currentTarget.style.background='#FBF8F7'} onMouseLeave={e=>e.currentTarget.style.background='none'}>📄 ייצוא CSV</button>
            <button onClick={exportExcel} style={{width:'100%',padding:'11px 16px',background:'none',border:'none',fontFamily:'Rubik',fontSize:16,fontWeight:600,cursor:'pointer',textAlign:'right',color:'#2B1F1C'}} onMouseEnter={e=>e.currentTarget.style.background='#FBF8F7'} onMouseLeave={e=>e.currentTarget.style.background='none'}>📊 ייצוא Excel</button>
          </div>}
          {showExportMenu&&<div style={{position:'fixed',inset:0,zIndex:199}} onClick={()=>setShowExportMenu(false)}/>}
        </div>
        <Btn variant="primary" onClick={openAdd}>+ מועמד</Btn>
      </div>
    </div>

    {/* ── PENDING CANDIDATES SECTION ── */}
    {pendingList.length>0&&<div className="pending-blink" style={{border:'2px solid #7A4E0866',borderRadius:12,background:'#FDF1DC',marginBottom:20,overflow:'hidden'}}>
      <div style={{background:'#FDF1DC',padding:'10px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',borderBottom:'1px solid #7A4E0866'}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <span style={{fontSize:21}}>🔔</span>
          <span style={{color:'#7A4E08',fontWeight:800,fontSize:17}}>מועמדים חדשים ממתינים לאישור</span>
          <span style={{background:'#7A4E08',color:'#FDF1DC',borderRadius:20,padding:'1px 10px',fontWeight:900,fontSize:15}}>{pendingList.length}</span>
        </div>
      </div>
      <div style={{padding:12,display:'flex',flexDirection:'column',gap:10}}>
        {pendingList.map(c=>{
          const job=data.jobs.find(j=>c.appliedJobs?.includes(j.id));
          return <div key={c.id} style={{background:'#FFFFFF',borderRadius:10,padding:'12px 14px',border:'1px solid #7A4E0866',display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
            <div style={{width:42,height:42,borderRadius:21,background:'#E98E82',color:'#2B120C',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,fontSize:21,flexShrink:0}}>{c.name.charAt(0)}</div>
            <div style={{flex:1,minWidth:120}}>
              <div style={{fontWeight:800,fontSize:17,cursor:'pointer'}} onClick={()=>openDetail(c)}>{c.name}</div>
              <div style={{fontSize:14,color:'#6B5D59'}}>{c.role||c.domain}{job?` · ${job.publishTitle||job.title}`:''}</div>
              <div style={{fontSize:13,color:'#A79892',marginTop:2}}>{c.phone}{c.city?` · ${c.city}`:''}{c.cv?' · 📄 CV':''}</div>
            </div>
            <div style={{display:'flex',gap:8,flexShrink:0}}>
              <button onClick={()=>openDetail(c)} style={{padding:'7px 14px',background:'#190D0B',color:'#F8F3F2',border:'none',borderRadius:8,fontFamily:'Rubik',fontWeight:700,fontSize:15,cursor:'pointer'}}>👁 צפה</button>
              <button onClick={()=>rejectPendingLocal(c.id)} style={{padding:'7px 12px',background:'#FCE4E8',color:'#A32C50',border:'none',borderRadius:8,fontFamily:'Rubik',fontWeight:700,fontSize:15,cursor:'pointer'}}>✕</button>
            </div>
          </div>;
        })}
      </div>
    </div>}

    <div style={{display:'flex',gap:8,marginBottom:8,flexWrap:'wrap',alignItems:'center'}}>
      <SearchBar placeholder="חיפוש שם, תפקיד, עיר..." value={search} onChange={setSearch}/>
      <button onClick={()=>setShowAdvanced(v=>!v)} style={{display:'flex',alignItems:'center',gap:6,padding:'7px 14px',background:showAdvanced?'#E98E82':activeFilters>0?'#E98E82':'#FBF8F7',color:showAdvanced?'#2B120C':activeFilters>0?'#2B120C':'#2B1F1C',border:'2px solid '+(showAdvanced?'#E98E82':activeFilters>0?'#E98E82':'#EAE2DF'),borderRadius:8,fontFamily:'Rubik',fontWeight:700,fontSize:15,cursor:'pointer'}}>🔍 סינון מתקדם{activeFilters>0&&<span style={{background:'#2B120C',color:'#E98E82',borderRadius:20,padding:'0 6px',fontSize:13,fontWeight:800}}>{activeFilters}</span>}</button>
      {(activeFilters>0||stFilter!=='הכל'||search)&&<button onClick={clearFilters} style={{padding:'7px 12px',background:'#FCE4E8',color:'#A32C50',border:'none',borderRadius:8,fontFamily:'Rubik',fontWeight:700,fontSize:15,cursor:'pointer'}}>✕ נקה</button>}
      <span style={{marginRight:'auto',fontSize:15,color:MUT}}>מציג <strong style={{color:'#E98E82'}}>{filteredAdv.length}</strong> מתוך {data.candidates.filter(c=>!pendingIds.has(c.id)).length}</span>
    </div>
    {showAdvanced&&<div style={{background:'#FFFFFF',border:'1.5px solid #EAE2DF',borderRadius:12,padding:'16px 20px',marginBottom:14,boxShadow:'0 4px 16px rgba(0,0,0,0.04)'}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}} className="mobile-grid-1">
        <div><div style={{fontSize:15,fontWeight:700,color:'#2B1F1C',marginBottom:5}}>תחום</div><select value={fDomain} onChange={e=>setFDomain(e.target.value)} style={selStyle}><option value="">כל התחומים</option>{allDomains.map(d=><option key={d} value={d}>{d}</option>)}</select></div>
        <div><div style={{fontSize:15,fontWeight:700,color:'#2B1F1C',marginBottom:5}}>עיר</div><select value={fCity} onChange={e=>setFCity(e.target.value)} style={selStyle}><option value="">כל הערים</option>{allCities.map(c=><option key={c} value={c}>{c}</option>)}</select></div>
        <div><div style={{fontSize:15,fontWeight:700,color:'#2B1F1C',marginBottom:5}}>CV</div><select value={fCv} onChange={e=>setFCv(e.target.value)} style={selStyle}>{['הכל','יש CV','אין CV'].map(o=><option key={o}>{o}</option>)}</select></div>
        <div><div style={{fontSize:15,fontWeight:700,color:'#2B1F1C',marginBottom:5}}>מקור</div><select value={fSource} onChange={e=>setFSource(e.target.value)} style={selStyle}>{['הכל','דף נחיתה','ידני'].map(o=><option key={o}>{o}</option>)}</select></div>
        <div><div style={{fontSize:15,fontWeight:700,color:'#2B1F1C',marginBottom:5}}>מ-תאריך</div><input type="date" value={fDateFrom} onChange={e=>setFDateFrom(e.target.value)} style={selStyle}/></div>
        <div><div style={{fontSize:15,fontWeight:700,color:'#2B1F1C',marginBottom:5}}>עד-תאריך</div><input type="date" value={fDateTo} onChange={e=>setFDateTo(e.target.value)} style={selStyle}/></div>
      </div>
    </div>}
    <div style={{display:'flex',gap:6,marginBottom:14,flexWrap:'wrap'}}>
      {['הכל','חדש','בתהליך','ראיון נקבע','השמה מוצלחת'].map(s=><Btn key={s} onClick={()=>setStFilter(s)} style={{background:stFilter===s?'#E98E82':'#FBF8F7',color:stFilter===s?'#2B120C':'#2B1F1C',padding:'5px 8px',fontSize:13}}>{s}</Btn>)}
    </div>

    {/* Mobile list */}
    <div className="mobile-only">
      {stages.map(stage=>{
        const sc=data.candidates.filter(c=>!pendingIds.has(c.id)&&c.status===stage&&(search===''||c.name.includes(search)||c.role.includes(search)));
        if(!sc.length) return null;
        return <div key={stage} style={{marginBottom:16}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
            <span style={{fontSize:16,fontWeight:700,background:TAG_COLORS[stage]||'#e2e3e5',border:'1.5px solid #EAE2DF',borderRadius:3,padding:'2px 10px'}}>{stage}</span>
            <span style={{fontSize:15,color:MUT}}>({sc.length})</span>
          </div>

          </button>
        </div>

      {dupWarn&&<div style={{background:'#FCE4E8',border:'2px solid #A32C50',borderRadius:10,padding:'12px 16px',marginBottom:12,display:'flex',alignItems:'center',gap:12}}>

        <div style={{flex:1}}>
          <div style={{fontWeight:800,fontSize:16,color:'#A32C50'}}>מועמד עם תעודת זהות זהה כבר קיים במערכת!</div>

        </div>
        <button onClick={()=>setDupWarn(null)} style={{background:'none',border:'none',cursor:'pointer',fontSize:21,color:'#A32C50',padding:'0 4px',lineHeight:1}}>✕</button>
      </div>}

      <div style={{display:'grid',gridTemplateColumns:'58% 42%',gap:18,alignItems:'start'}}>

        {/* COL 1 — טופס מימין */}

              <FF label="שם מלא" value={form.name||''} onChange={v=>setForm(f=>({...f,name:v}))} full={true}/>
              <FF label="תעודת זהות" value={form.idNumber||''} onChange={v=>{setForm(f=>({...f,idNumber:v}));setDupWarn(checkDupId(v,form.id));}} aiHighlight={!!aiFields["idNumber"]}/>
              <FF label="טלפון" value={form.phone||''} onChange={v=>setForm(f=>({...f,phone:v}))} aiHighlight={!!aiFields["phone"]}/>
              <FF label="אימייל" type="email" value={form.email||''} onChange={v=>setForm(f=>({...f,email:v}))} aiHighlight={!!aiFields["email"]}/>
              <FF label="עיר" value={form.city||''} onChange={v=>setForm(f=>({...f,city:v}))} aiHighlight={!!aiFields["city"]}/>
              <FF label="תאריך לידה" type="date" value={form.birthDate||''} onChange={v=>setForm(f=>({...f,birthDate:v}))} aiHighlight={!!aiFields["birthDate"]}/>
              <FF label="מין" type="select" value={form.gender||''} onChange={v=>setForm(f=>({...f,gender:v}))} options={['','זכר','נקבה','אחר']} aiHighlight={!!aiFields["gender"]}/>
              <FF label="מצב משפחתי" type="select" value={form.maritalStatus||''} onChange={v=>setForm(f=>({...f,maritalStatus:v}))} options={['','רווק/ה','נשוי/אה','גרוש/ה','אלמן/ה']} aiHighlight={!!aiFields["maritalStatus"]}/>
              <FF label="רישיון נהיגה" type="select" value={form.drivingLicense||''} onChange={v=>setForm(f=>({...f,drivingLicense:v}))} options={['','יש','אין']} aiHighlight={!!aiFields["drivingLicense"]}/>
              <FF label="נידות" type="select" value={form.mobility||''} onChange={v=>setForm(f=>({...f,mobility:v}))} options={['','כן','לא','חלקית']}/>
            </FormGrid>
          </FormCard>

          <FormCard title="פרופיל מקצועי" icon="💼" color="#EFEAE8">
            <FormGrid>
              <div>
                <label style={{display:'block',fontSize:15,fontWeight:700,color:'#2B1F1C',marginBottom:5}}>תחום</label>
                <select value={form.domain||''} onChange={e=>setForm(f=>({...f,domain:e.target.value,role:''}))} className={aiFields["domain"]?"ai-filled":""} style={{width:'100%',padding:'10px 14px',border:aiFields["domain"]?'2px solid #3b82f6':'2px solid #9ca3af',borderRadius:8,fontFamily:'Rubik',fontSize:17,background:'#0f1929'}}>
                  <option value="">-- בחר תחום --</option>
                  {(data.jobDomains||[]).map(d=><option key={d.id} value={d.name}>{d.name}</option>)}
                </select>
              </div>
              <div>
                <label style={{display:'block',fontSize:15,fontWeight:700,color:'#2B1F1C',marginBottom:5}}>תפקיד</label>
                <select value={form.role||''} onChange={e=>setForm(f=>({...f,role:e.target.value}))} disabled={!form.domain} className={aiFields["role"]?"ai-filled":""} style={{width:'100%',padding:'10px 14px',border:aiFields["role"]?'2px solid #3b82f6':'2px solid #9ca3af',borderRadius:8,fontFamily:'Rubik',fontSize:17,background:!form.domain?'#f0f2f5':'#0f1929'}}>
                  <option value="">{form.domain?'-- בחר תפקיד --':'בחר תחום תחילה'}</option>
                  {(data.jobDomains||[]).find(d=>d.name===form.domain)?.roles.map(r=><option key={r} value={r}>{r}</option>)}
                </select>
              </div>
              <FF label="ניסיון" type="textarea" value={form.experience||''} onChange={v=>setForm(f=>({...f,experience:v}))} aiHighlight={!!aiFields["experience"]}/>
              <FF label="השכלה" type="textarea" value={form.education||''} onChange={v=>setForm(f=>({...f,education:v}))} aiHighlight={!!aiFields["education"]}/>
              <FF label="שכר מינימלי (₪)" value={form.minSalary||''} onChange={v=>setForm(f=>({...f,minSalary:v}))} aiHighlight={!!aiFields["minSalary"]}/>
              <FF label="שכר מקסימלי (₪)" value={form.maxSalary||''} onChange={v=>setForm(f=>({...f,maxSalary:v}))}/>
              <FF label="ציון במבחן" value={form.testScore||''} onChange={v=>setForm(f=>({...f,testScore:v}))}/>
              <FF label="מקור ליד" value={form.leadSource||''} onChange={v=>setForm(f=>({...f,leadSource:v}))} hint="למשל: פייסבוק, לינקדאין, המלצה..." full={false}/>
              <FF label="סטטוס" type="select" value={form.status||'חדש'} onChange={v=>{
                const upd={...form,status:v};
                if(v==='השמה מוצלחת'&&!form.placedAt) upd.placedAt=new Date().toISOString().split('T')[0];
                if(v!=='השמה מוצלחת') upd.placedAt='';
                setForm(f=>({...f,...upd}));
              }} options={data.statuses?.candidates?.length?data.statuses.candidates:['חדש','בתהליך','ראיון נקבע','השמה מוצלחת']}/>
              {form.status==='השמה מוצלחת'&&<div>
                <div style={{fontSize:15,fontWeight:600,color:'#6B5D59',marginBottom:4}}>📅 תאריך הצבה</div>
                <input type="date" value={form.placedAt||''} onChange={e=>setForm(f=>({...f,placedAt:e.target.value}))}
                  style={{width:'100%',padding:'9px 12px',border:'1.5px solid #e5e7eb',borderRadius:9,fontFamily:'Rubik',fontSize:16,outline:'none'}}/>
              </div>}
            </FormGrid>
          </FormCard>

          <FormCard title="שליטה בשפות" icon="🌐" color="#EFEAE8">
            <FormGrid>
              <FF label="עברית" type="select" value={form.langHebrew||''} onChange={v=>setForm(f=>({...f,langHebrew:v}))} options={['','שפת אם','טובה מאוד','טובה','בסיסית']}/>
              <FF label="אנגלית" type="select" value={form.langEnglish||''} onChange={v=>setForm(f=>({...f,langEnglish:v}))} options={['','שפת אם','טובה מאוד','טובה','בסיסית']}/>
              <FF label="ערבית" type="select" value={form.langArabic||''} onChange={v=>setForm(f=>({...f,langArabic:v}))} options={['','שפת אם','טובה מאוד','טובה','בסיסית']}/>
              <FF label="רוסית" type="select" value={form.langRussian||''} onChange={v=>setForm(f=>({...f,langRussian:v}))} options={['','שפת אם','טובה מאוד','טובה','בסיסית']}/>
              <FF label="ספרדית" type="select" value={form.langSpanish||''} onChange={v=>setForm(f=>({...f,langSpanish:v}))} options={['','שפת אם','טובה מאוד','טובה','בסיסית']}/>
              <FF label="צרפתית" type="select" value={form.langFrench||''} onChange={v=>setForm(f=>({...f,langFrench:v}))} options={['','שפת אם','טובה מאוד','טובה','בסיסית']}/>
              <FF label="אמהרית" type="select" value={form.langAmharic||''} onChange={v=>setForm(f=>({...f,langAmharic:v}))} options={['','שפת אם','טובה מאוד','טובה','בסיסית']}/>
            </FormGrid>
          </FormCard>
          <FormCard title="הקצאת משרות" icon="🔗" color="#EFEAE8">
            {(()=>{
              const filtered=data.jobs.filter(j=>{
                const q=jobSearch.toLowerCase();
                return !q||(j.title||'').toLowerCase().includes(q)||(j.publishTitle||'').toLowerCase().includes(q)||(j.jobNumber||'').toLowerCase().includes(q);
              });
              const selectedJobs=data.jobs.filter(j=>(form.appliedJobs||[]).includes(j.id));
              return <div style={{position:'relative'}}>
                {/* כפתור בחירה */}
                <button type="button" onClick={()=>setShowJobPicker(v=>!v)}
                  style={{width:'100%',padding:'10px 14px',background:'#FBF8F7',border:'2px solid #E98E82',borderRadius:9,fontFamily:'Rubik',fontSize:15,fontWeight:700,color:'#2B1F1C',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'space-between',textAlign:'right'}}>
                  <span>🔗 {selectedJobs.length>0?`${selectedJobs.length} משרות נבחרו`:'בחר משרות...'}</span>
                  <span style={{fontSize:12,opacity:.6}}>{showJobPicker?'▲':'▼'}</span>
                </button>

                {/* תגיות משרות נבחרות */}
                {selectedJobs.length>0&&<div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:8}}>
                  {selectedJobs.map(j=>(
                    <div key={j.id} style={{display:'flex',alignItems:'center',gap:5,background:'#FBF8F7',border:'1px solid #E98E82',borderRadius:7,padding:'4px 10px',fontSize:14,fontWeight:600,color:'#2B1F1C'}}>
                      <span>{j.publishTitle||j.title}</span>
                      <button type="button" onClick={()=>setForm(f=>({...f,appliedJobs:f.appliedJobs.filter(id=>id!==j.id)}))}
                        style={{background:'none',border:'none',cursor:'pointer',color:'#A32C50',fontSize:15,lineHeight:1,padding:0,marginRight:2}}>×</button>
                    </div>
                  ))}
                </div>}

                {/* Dropdown */}
                {showJobPicker&&<div style={{position:'absolute',top:'calc(100% + 6px)',right:0,left:0,background:'#FFFFFF',border:'2px solid #E98E82',borderRadius:10,boxShadow:'0 8px 24px rgba(0,0,0,0.12)',zIndex:500,overflow:'hidden'}}>
                  <div style={{padding:'8px 10px',borderBottom:'1px solid #EAE2DF',background:'#FBF8F7'}}>
                    <input
                      value={jobSearch} onChange={e=>setJobSearch(e.target.value)}
                      placeholder="🔍 חפש לפי שם או מספר..."
                      style={{width:'100%',padding:'7px 10px',border:'1.5px solid #e5e7eb',borderRadius:7,fontFamily:'Rubik',fontSize:14,outline:'none',background:'#141d35'}}
                      autoFocus
                    />
                  </div>
                  <div style={{maxHeight:200,overflowY:'auto'}}>
                    {filtered.length===0&&<div style={{padding:'12px',textAlign:'center',color:'#A79892',fontSize:15}}>לא נמצאו משרות</div>}
                    {filtered.map(j=>{
                      const emp=data.employers.find(x=>x.id===j.employerId);
                      const chk=(form.appliedJobs||[]).includes(j.id);
                      return <label key={j.id} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 12px',background:chk?'#FBF8F7':'#FFFFFF',borderBottom:'1px solid #EAE2DF',cursor:'pointer'}}>
                        <input type="checkbox" checked={!!chk} onChange={()=>setForm(f=>({...f,appliedJobs:chk?f.appliedJobs.filter(id=>id!==j.id):[...(f.appliedJobs||[]),j.id]}))}/>
                        <div style={{flex:1}}>
                          <div style={{fontWeight:700,fontSize:14,color:'#2B1F1C'}}>{j.publishTitle||j.title}</div>
                          <div style={{fontSize:13,color:'#6B5D59'}}>{emp?.name||''} · {j.jobNumber}{j.location?` · ${j.location}`:''}</div>
                        </div>
                        <Tag label={j.status}/>
                      </label>;
                    })}
                  </div>
                  <div style={{padding:'8px 12px',borderTop:'1px solid #EAE2DF',background:'#FBF8F7',display:'flex',justifyContent:'flex-end'}}>
                    <button type="button" onClick={()=>setShowJobPicker(false)}
                      style={{padding:'6px 16px',background:'#E98E82',color:'#2B120C',border:'none',borderRadius:7,fontFamily:'Rubik',fontWeight:700,fontSize:14,cursor:'pointer'}}>
                      אישור
                    </button>
                  </div>
                </div>}
              </div>;
            })()}
          </FormCard>

          <FormCard title="הערות" icon="📝" color="#EFEAE8">
            <FF label="" type="textarea" value={form.notes||''} onChange={v=>setForm(f=>({...f,notes:v}))} aiHighlight={!!aiFields["notes"]}/>
          </FormCard>
        </div>        {/* COL 2 — CV משמאל */}
        <div style={{position:'sticky',top:0}}>
          <div style={{background:'#FFFFFF',borderRadius:16,overflow:'hidden',boxShadow:'0 2px 12px rgba(0,0,0,0.06)',border:'1px solid #EAE2DF'}}>
            <div style={{background:'#190D0B',padding:'12px 18px',display:'flex',alignItems:'center',gap:8}}>
              <div style={{fontSize:18}}>📄</div>
              <div style={{fontWeight:800,fontSize:16,color:'#F8F3F2',flex:1}}>קורות חיים</div>
              {form._cvFile
                ?<a href={cvBlobUrl} target="_blank" rel="noreferrer" style={{padding:'4px 12px',background:'#E98E82',color:'#2B120C',borderRadius:6,textDecoration:'none',fontWeight:700,fontSize:14}}>פתח</a>
                :modal==='edit'&&form.cvUrl&&<>
                  <a href={form.cvUrl} target="_blank" rel="noreferrer" style={{padding:'4px 12px',background:'#E98E82',color:'#2B120C',borderRadius:6,textDecoration:'none',fontWeight:700,fontSize:14}}>פתח</a>
                  <a href={form.cvUrl} download style={{padding:'4px 10px',background:'rgba(255,255,255,0.15)',color:'#F8F3F2',borderRadius:6,textDecoration:'none',fontWeight:700,fontSize:14}}>⬇️</a>
                </>}
            </div>
            {form._cvFile
              ?(()=>{
                  const fext=form._cvFile.name.split('.').pop().toLowerCase();
                  return <>
                    {fext==='pdf'
                      ?<iframe src={cvBlobUrl} style={{width:'100%',height:'calc(90vh - 260px)',border:'none',display:'block'}} title="CV"/>
                      :(fext==='docx'||fext==='doc')
                        ?cvPreviewHtml
                          ?<div style={{height:'calc(90vh - 260px)',overflow:'auto',padding:16,direction:'rtl',fontSize:15}} dangerouslySetInnerHTML={{__html:cvPreviewHtml}}/>
                          :<div style={{height:'calc(90vh - 260px)',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:12,padding:24}}>
                              <div style={{fontSize:51}}>📄</div>
                              <div style={{fontWeight:700,color:'#2B1F1C',textAlign:'center'}}>{form._cvFile.name}</div>
                              <div style={{fontSize:14,color:'#6B5D59'}}>טוען תצוגה מקדימה...</div>
                            </div>
                        :['jpg','jpeg','png','webp','gif'].includes(fext)
                          ?<div style={{height:'calc(90vh - 260px)',overflow:'auto',padding:16,display:'flex',alignItems:'center',justifyContent:'center'}}>
                              <img src={cvBlobUrl} style={{maxWidth:'100%',maxHeight:'100%',objectFit:'contain'}} alt="CV"/>
                            </div>
                          :<div style={{height:'calc(90vh - 260px)',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:12}}>
                              <div style={{fontSize:55}}>📄</div>
                              <a href={cvBlobUrl} download={form._cvFile.name} style={{padding:'10px 20px',background:'#E98E82',color:'#2B120C',borderRadius:10,textDecoration:'none',fontWeight:700,fontSize:16}}>⬇️ הורד קובץ</a>
                            </div>
                    }
                    <div style={{padding:'8px 12px',borderTop:'1px solid #EAE2DF',display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
                      <button type="button" onClick={e=>{e.stopPropagation();document.getElementById('cv-upload-input').click();}} style={{padding:'6px 14px',background:'#FBF8F7',border:'2px solid #EAE2DF',borderRadius:8,fontFamily:'Rubik',fontWeight:700,fontSize:14,cursor:'pointer',color:'#2B1F1C'}}>📂 החלף קובץ</button>
                      {cvParsing
                        ?<div style={{fontSize:14,color:'#1D4FBF',fontWeight:700,display:'flex',alignItems:'center',gap:6}}><span>🤖</span><span>מפענח...</span></div>
                        :<button type="button" onClick={e=>{e.stopPropagation();runParseOnExisting();}} style={{padding:'7px 16px',background:'#DCEEFB',border:'1.5px solid #1D4FBF66',borderRadius:8,fontFamily:'Rubik',fontWeight:800,fontSize:14,cursor:'pointer',color:'#1D4FBF'}}>🤖 זהה שדות אוטומטית</button>
                      }
                      <input id="cv-upload-input" type="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,.webp,.gif" style={{display:'none'}} onChange={handleCvDrop}/>
                    </div>
                  </>;
                })()
              :modal==='edit'&&form.cvUrl
                ?form.cvUrl.toLowerCase().endsWith('.pdf')
                  ?<iframe src={form.cvUrl} style={{width:'100%',height:'calc(90vh - 200px)',border:'none',display:'block'}} title="CV"/>
                  :(form.cvUrl.toLowerCase().endsWith('.docx')||form.cvUrl.toLowerCase().endsWith('.doc'))
                    ?<iframe src={'https://docs.google.com/gview?url='+encodeURIComponent(form.cvUrl)+'&embedded=true'} style={{width:'100%',height:'calc(90vh - 200px)',border:'none',display:'block'}} title="CV"/>
                    :<div style={{height:'calc(90vh - 200px)',background:'#FBF8F7',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:12}}>
                        <div style={{fontSize:55}}>📄</div>
                        <a href={form.cvUrl} download style={{padding:'10px 20px',background:'#E98E82',color:'#2B120C',borderRadius:10,textDecoration:'none',fontWeight:700,fontSize:16}}>⬇️ הורד קובץ</a>
                      </div>
                :<div
                    onDragOver={e=>{e.preventDefault();setCvDrag(true);}}
                    onDragLeave={()=>setCvDrag(false)}
                    onDrop={handleCvDrop}
                    style={{height:'calc(90vh - 200px)',background:cvDrag?'#FBF8F7':cvParsing?'#DCEEFB':'#FBF8F7',border:'2px dashed '+(cvDrag?'#E98E82':cvParsing?'#1D4FBF':'#EAE2DF'),display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:12,transition:'all .2s',padding:24}}>
                    {cvParsing
                      ?<>
                          <div style={{fontSize:51}}>🤖</div>
                          <div style={{fontWeight:800,fontSize:17,color:'#1D4FBF',textAlign:'center'}}>מפענח נתונים...</div>
                          <div style={{fontSize:14,color:'#1D4FBF',textAlign:'center'}}>הבינה המלאכותית מנתחת את קורות החיים</div>
                          <div style={{width:140,height:6,background:'#DCEEFB',borderRadius:3,overflow:'hidden',marginTop:4}}>
                            <div style={{height:'100%',width:'40%',background:'#1D4FBF',borderRadius:3,animation:'parsing-shimmer 1s infinite'}}/>
                          </div>
                        </>
                      :<>
                          <div style={{fontSize:60,opacity:cvDrag?1:.35}}>📄</div>
                          <div style={{fontWeight:800,fontSize:17,color:cvDrag?'#E98E82':'#2B1F1C',textAlign:'center'}}>{form._cvName||'גרור קורות חיים לכאן'}</div>
                          {!form._cvName&&<div style={{fontSize:14,color:'#A79892',textAlign:'center'}}>גרור לכאן · PDF / DOC / DOCX / תמונה</div>}
                          <button type="button"
                            onClick={e=>{e.stopPropagation();document.getElementById('cv-upload-input').click();}}
                            style={{padding:'8px 18px',background:'#FFFFFF',border:'2px solid #EAE2DF',borderRadius:8,fontFamily:'Rubik',fontWeight:700,fontSize:15,cursor:'pointer',color:'#2B1F1C',marginTop:4}}>
                            📂 בחר קובץ
                          </button>
                        </>
                    }
                    <input id="cv-upload-input" type="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,.webp,.gif" style={{display:'none'}} onChange={handleCvDrop}/>
                  </div>
            }
          </div>
        </div>


      </div>
    </Modal>}

    {/* Modal בחירת משרה להשמה */}
    {placeModal&&<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.65)',backdropFilter:'blur(4px)',zIndex:1200,display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
      <div style={{background:'#FFFFFF',borderRadius:20,width:'100%',maxWidth:480,boxShadow:'0 20px 60px rgba(0,0,0,0.2)',overflow:'hidden'}}>
        <div style={{background:'#0F6B33',padding:'20px 24px'}}>
          <div style={{color:'white',fontWeight:800,fontSize:21}}>🏅 השמה מוצלחת</div>
          <div style={{color:'rgba(255,255,255,0.8)',fontSize:15,marginTop:4}}>{placeModal.candName} — באיזו משרה הושם/ה?</div>
        </div>
        <div style={{padding:'16px 20px'}}>
          {placeModal.jobs.map(j=>{
            const emp=data.employers.find(e=>e.id===j.employerId);
            return <button key={j.id} onClick={()=>doPlace(placeModal.candidateId,j.id)}
              style={{display:'flex',alignItems:'center',gap:12,width:'100%',padding:'13px 16px',marginBottom:8,background:'#FFFFFF',border:'2px solid #EAE2DF',borderRadius:12,cursor:'pointer',fontFamily:'Rubik',textAlign:'right',transition:'all .15s'}}
              onMouseEnter={e=>{e.currentTarget.style.background='#FBF8F7';e.currentTarget.style.borderColor='#E98E82';}}
              onMouseLeave={e=>{e.currentTarget.style.background='#FFFFFF';e.currentTarget.style.borderColor='#EAE2DF';}}>
              <div style={{width:40,height:40,borderRadius:10,background:'#E3F6EC',display:'flex',alignItems:'center',justifyContent:'center',fontSize:23,flexShrink:0}}>📋</div>
              <div style={{flex:1}}>

function SearchSelect({value,onChange,options,placeholder,disabled,inputStyle}){
  const [search,setSearch]=React.useState('');
  const [open,setOpen]=React.useState(false);
  const getVal=o=>typeof o==='object'&&o!==null?o.value:o;
  const getLabel=o=>typeof o==='object'&&o!==null?o.label:o;
  const found=(options||[]).find(o=>getVal(o)===value);
  const displayVal=value?(found?getLabel(found):value):'';
  const term=search.trim().toLowerCase();
  const filtered=React.useMemo(()=>(options||[]).filter(o=>!term||String(getLabel(o)).toLowerCase().includes(term)),[options,term]);
  const IS={...inputStyle,paddingLeft:32,textAlign:'right',direction:'rtl',cursor:disabled?'not-allowed':'pointer',opacity:disabled?0.45:1};
  return <div style={{position:'relative'}}>
    <input disabled={disabled} value={open?search:displayVal}
      onChange={e=>setSearch(e.target.value)}
      onFocus={()=>{setSearch('');setOpen(true);}}
      onBlur={()=>setTimeout(()=>{setOpen(false);setSearch('');},200)}
      placeholder={placeholder||'-- בחר --'} style={IS}/>
    <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',pointerEvents:'none',color:'#A79892',fontSize:11}}>▼</span>
    {open&&!disabled&&<div style={{position:'absolute',top:'100%',right:0,left:0,background:'#FFFFFF',border:'1.5px solid #EAE2DF',borderRadius:10,zIndex:500,maxHeight:250,overflowY:'auto',boxShadow:'0 8px 24px rgba(0,0,0,0.12)',marginTop:3}}>
      <div onMouseDown={()=>{onChange('');setSearch('');setOpen(false);}} className="dd-item dd-placeholder" onMouseEnter={e=>e.currentTarget.style.background='#f3f4f6'} onMouseLeave={e=>e.currentTarget.style.background=''}>{placeholder||'-- הכל --'}</div>
      {filtered.length===0&&<div className="dd-item dd-empty">לא נמצאו תוצאות</div>}
      {filtered.map(o=><div key={getVal(o)} onMouseDown={()=>{onChange(getVal(o));setSearch('');setOpen(false);}}
        className={`dd-item${value===getVal(o)?' dd-selected':''}`} onMouseEnter={e=>e.currentTarget.style.background=value===getVal(o)?'#fde8dc':'#f3f4f6'} onMouseLeave={e=>e.currentTarget.style.background=value===getVal(o)?'#fff5f0':''}>{getLabel(o)}</div>)}
    </div>}
  </div>;
}

function Tasks({data,setData}){
  const [modal,setModal]=React.useState(null);
  const [filter,setFilter]=React.useState('הכל');
  const [priorityFilter,setPriorityFilter]=React.useState('הכל');
  const [viewMode,setViewMode]=React.useState('kanban');
  const [dragId,setDragId]=React.useState(null);
  const tasks=data.tasks||[];

  const saveTask=form=>{
    const isNew=!form.id;
    const t=isNew?{...form,id:'t'+Date.now(),createdAt:new Date().toISOString()}:{...form};
    setData(d=>({...d,tasks:isNew?[t,...(d.tasks||[])]:(d.tasks||[]).map(x=>x.id===t.id?t:x)}));
    setModal(null);
  };
  const delTask=id=>setData(d=>({...d,tasks:(d.tasks||[]).filter(t=>t.id!==id)}));
  const moveTask=(id,newStatus)=>setData(d=>({...d,tasks:(d.tasks||[]).map(t=>t.id===id?{...t,status:newStatus}:t)}));

  const COLS=[
    {key:'פתוח',label:'פתוח',color:'#1D4FBF',bg:'#DCEEFB',icon:'\u{1F4CB}'},
    {key:'בתהליך',label:'בתהליך',color:'#7A4E08',bg:'#FDF1DC',icon:'⏳'},
    {key:'הושלם',label:'הושלם',color:'#0F6B33',bg:'#E3F6EC',icon:'✅'},
  ];
  const PRIO_COLOR={'גבוה':'#A32C50','בינוני':'#7A4E08','נמוך':'#1D4FBF'};
  const PRIO_BG={'גבוה':'#FCE4E8','בינוני':'#FDF1DC','נמוך':'#DCEEFB'};

  const filtered=tasks.filter(t=>{
    if(filter!=='הכל'&&t.status!==filter)return false;
    if(priorityFilter!=='הכל'&&t.priority!==priorityFilter)return false;
    return true;
  });

  const TaskCard=({t})=>{
    const emp=data.employers.find(e=>e.id===t.employerId);
    const cand=data.candidates.find(c=>c.id===t.candidateId);
    const pc=PRIO_COLOR[t.priority]||'#7a8599';
    const due=t.dueDate?new Date(t.dueDate):null;
    const overdue=due&&due<new Date()&&t.status!=='הושלם';
    return <div draggable onDragStart={()=>setDragId(t.id)} onDragEnd={()=>setDragId(null)}
      style={{background:'#FFFFFF',borderRadius:10,border:'1px solid #EAE2DF',boxShadow:'0 2px 6px rgba(0,0,0,0.06)',
        marginBottom:8,overflow:'hidden',opacity:dragId===t.id?0.5:1,cursor:'grab',position:'relative'}}>
      {/* Priority bar */}
      <div style={{position:'absolute',top:0,bottom:0,right:0,width:4,background:pc,borderRadius:'0 10px 10px 0'}}/>
      <div style={{padding:'10px 14px 10px 10px'}}>
        <div style={{display:'flex',alignItems:'flex-start',gap:8,marginBottom:6}}>
          <div style={{flex:1}}>
            <div style={{fontWeight:700,fontSize:16,color:'#2B1F1C',lineHeight:1.3}}>{t.title}</div>
            {t.description&&<div style={{fontSize:14,color:'#6B5D59',marginTop:3,lineHeight:1.4}}>{t.description}</div>}
          </div>
          <div style={{display:'flex',gap:4,flexShrink:0}}>
            <button onClick={()=>setModal(t)} style={{background:'none',border:'none',cursor:'pointer',padding:3,color:'#6B5D59',fontSize:15}}>✏️</button>
            <button onClick={()=>{if(confirm('למחוק?'))delTask(t.id);}} style={{background:'none',border:'none',cursor:'pointer',padding:3,color:'#A32C50',fontSize:15}}>🗑</button>
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
          <span style={{display:'inline-flex',alignItems:'center',gap:5,fontSize:13,color:pc,fontWeight:700}}><span style={{width:6,height:6,borderRadius:'50%',background:pc,display:'inline-block'}}/>{t.priority||'רגיל'}</span>

          {cand&&<span style={{fontSize:13,background:'#EFEAE8',color:'#4A3F3C',borderRadius:6,padding:'1px 7px'}}>👤 {cand.name}</span>}

        </div>
      </div>
    </div>;
  };

;
