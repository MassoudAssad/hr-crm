        const colTasks=filtered.filter(t=>t.status===col.key);
        return <div key={col.key}
          onDragOver={e=>{e.preventDefault();e.currentTarget.style.background=col.bg;}}
          onDragLeave={e=>e.currentTarget.style.background='#FBF8F7'}
          onDrop={e=>{e.currentTarget.style.background='#FBF8F7';if(dragId)moveTask(dragId,col.key);}}
          style={{background:'#FBF8F7',borderRadius:14,border:'1.5px solid #EAE2DF',padding:'12px',minHeight:200,transition:'background .2s'}}>
          {/* Column header */}
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14,padding:'6px 4px'}}>
            <span style={{fontSize:18}}>{col.icon}</span>
            <span style={{fontWeight:800,fontSize:17,color:'#2B1F1C',flex:1}}>{col.label}</span>
            <span style={{background:col.color,color:'#FFFFFF',borderRadius:12,padding:'1px 9px',fontSize:14,fontWeight:800}}>{colTasks.length}</span>
          </div>
          {/* Tasks */}
          {colTasks.map(t=><TaskCard key={t.id} t={t}/>)}
          {/* Add button */}
          <button onClick={()=>setModal({initialStatus:col.key})} style={{width:'100%',padding:'7px 0',background:'transparent',border:'2px dashed #EAE2DF',borderRadius:8,fontFamily:'Rubik',fontWeight:600,fontSize:15,color:'#6B5D59',cursor:'pointer',marginTop:4,transition:'all .15s'}} onMouseEnter={e=>{e.target.style.borderColor=col.color;e.target.style.color=col.color;}} onMouseLeave={e=>{e.target.style.borderColor='#EAE2DF';e.target.style.color='#6B5D59';}}>+ הוסף</button>
        </div>;
      })}
    </div>}

    {/* List view */}
    {viewMode==='list'&&<div style={{display:'flex',flexDirection:'column',gap:8}}>
      {filtered.length===0&&<div style={{textAlign:'center',padding:'40px 0',color:'#6B5D59',fontSize:17}}>אין משימות</div>}
      {filtered.map(t=>{
        const emp=data.employers.find(e=>e.id===t.employerId);
        const cand=data.candidates.find(c=>c.id===t.candidateId);
        const pc=PRIO_COLOR[t.priority]||'#6B5D59';
        const col=COLS.find(c=>c.key===t.status)||COLS[0];
        return <div key={t.id} style={{background:'#FFFFFF',borderRadius:10,border:'1px solid #EAE2DF',boxShadow:'0 2px 6px rgba(0,0,0,0.06)',padding:'12px 16px',display:'flex',alignItems:'center',gap:12,borderRight:`4px solid ${pc}`}}>
          <div style={{flex:1}}>
            <div style={{fontWeight:700,fontSize:16,color:'#2B1F1C'}}>{t.title}</div>
            <div style={{fontSize:14,color:'#6B5D59',marginTop:2}}>{t.description}</div>
          </div>
          <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap',justifyContent:'flex-end'}}>
            <span style={{fontSize:14,background:col.bg,color:col.color,borderRadius:6,padding:'2px 9px',fontWeight:700}}>{col.icon} {t.status}</span>
            <span style={{display:'inline-flex',alignItems:'center',gap:5,fontSize:14,color:pc,fontWeight:700}}><span style={{width:6,height:6,borderRadius:'50%',background:pc,display:'inline-block'}}/>{t.priority}</span>
            {emp&&<span style={{fontSize:14,color:'#6B5D59'}}>🏢 {emp.name}</span>}
            {t.dueDate&&<span style={{fontSize:14,color:'#6B5D59'}}>📅 {t.dueDate}</span>}
            <button onClick={()=>setModal(t)} style={{padding:'5px 10px',background:'#FFFFFF',border:'1px solid #EAE2DF',borderRadius:6,cursor:'pointer',fontSize:14,fontFamily:'Rubik'}}>✏️</button>
            <button onClick={()=>{if(confirm('למחוק?'))delTask(t.id);}} style={{padding:'5px 10px',background:'#FFFFFF',border:'1px solid #FCE4E8',borderRadius:6,cursor:'pointer',fontSize:14,fontFamily:'Rubik',color:'#A32C50'}}>🗑</button>
          </div>
        </div>;
      })}
    </div>}

    {modal&&<TaskModal task={modal?.id?modal:null} data={data} onSave={saveTask} onClose={()=>setModal(null)} initialStatus={modal?.initialStatus||'פתוח'}/>}
  </div>;
}

// ── CANDIDATE HUNTER ──────────────────────────────────────────────────────────
function CandidateHunter({data}){
  const [domain,setDomain]=React.useState('');
  const [role,setRole]=React.useState('');
  const [city,setCity]=React.useState('');
  const [freeText,setFreeText]=React.useState('');
  const [includeHired,setIncludeHired]=React.useState(true);
  const [selJob,setSelJob]=React.useState('');
  const [results,setResults]=React.useState(null);
  const [searched,setSearched]=React.useState(false);

  const allCities=[...new Set(data.candidates.map(c=>c.city).filter(Boolean))].sort();
  const allDomains=[...new Set([
    ...(data.jobDomains||[]).map(d=>d.name),
    ...data.candidates.map(c=>c.domain).filter(Boolean)
  ])].sort();
  const allRoles=[...new Set([
    ...(data.jobDomains||[]).flatMap(d=>d.roles||[]),
    ...data.candidates.map(c=>c.role).filter(Boolean)
  ])].filter(r=>!domain||(data.jobDomains||[]).find(d=>d.name===domain)?.roles.includes(r)||data.candidates.some(c=>c.domain===domain&&c.role===r)).sort();

  const loadFromJob=()=>{
    const job=data.jobs.find(j=>j.id===selJob);
    if(!job) return;
    setDomain(job.domain||'');
    setRole(job.role||'');
    setCity('');
    setFreeText('');
  };

  const score=(c,ft)=>{
    let s=0;
    const cDomain=(c.domain||'').trim().toLowerCase();
    const cRole=(c.role||'').trim().toLowerCase();
    const cCity=(c.city||'').trim().toLowerCase();
    const sDomain=domain.trim().toLowerCase();
    const sRole=role.trim().toLowerCase();
    const sCity=city.trim().toLowerCase();
    if(sDomain){if(cDomain===sDomain)s+=35;else if(cDomain.includes(sDomain)||sDomain.includes(cDomain))s+=15;}else{s+=35;}
    if(sRole){if(cRole===sRole)s+=25;else if(cRole.includes(sRole)||sRole.includes(cRole))s+=12;}else{s+=25;}
    if(sCity){if(cCity===sCity||cCity.includes(sCity)||sCity.includes(cCity))s+=20;}else{s+=20;}
    if(ft){const hay=[c.name,c.role,c.domain,c.city,c.experience,c.education,c.notes].join(' ').toLowerCase();if(hay.includes(ft.toLowerCase()))s+=15;}
    return s;
  };

  const hunt=()=>{
    const ft=freeText.trim();
    if(!domain&&!role&&!city&&!ft){showToast('יש להזין לפחות קריטריון אחד','info');return;}
    const sDomain=domain.trim().toLowerCase();
    const sRole=role.trim().toLowerCase();
    const sCity=city.trim().toLowerCase();
    const candidates=data.candidates.filter(c=>{
      if(!includeHired && c.status==='השמה מוצלחת') return false;
      if(sDomain){const cd=(c.domain||'').trim().toLowerCase();if(!cd.includes(sDomain)&&!sDomain.includes(cd))return false;}
      if(sRole){const cr=(c.role||'').trim().toLowerCase();if(!cr.includes(sRole)&&!sRole.includes(cr))return false;}
      if(sCity){const cc=(c.city||'').trim().toLowerCase();if(!cc.includes(sCity)&&!sCity.includes(cc))return false;}
      if(ft){const hay=[c.name,c.role,c.domain,c.city,c.experience,c.education,c.notes].join(' ').toLowerCase();if(!hay.includes(ft.toLowerCase()))return false;}
      return true;
    });
    const scored=candidates.map(c=>({...c,_score:score(c,ft)})).sort((a,b)=>b._score-a._score);
    setResults(scored);
    setSearched(true);
  };

  const reset=()=>{setDomain('');setRole('');setCity('');setFreeText('');setSelJob('');setResults(null);setSearched(false);};

  const tier=(s)=>s>=70?'high':s>=40?'mid':'low';
  const tierLabel={high:{label:'התאמה גבוהה',color:'#0F6B33',bg:'#E3F6EC',border:'#0F6B3366'},mid:{label:'התאמה חלקית',color:'#7A4E08',bg:'#FDF1DC',border:'#7A4E0866'},low:{label:'התאמה חלשה',color:'#4A3F3C',bg:'#EFEAE8',border:'#4A3F3C66'}};

  const high=results?results.filter(c=>tier(c._score)==='high'):[];
  const mid=results?results.filter(c=>tier(c._score)==='mid'):[];

  const [msgTarget,setMsgTarget]=React.useState(null);

  const inputStyle={width:'100%',padding:'10px 14px',borderRadius:9,border:'1.5px solid #1f2d47',background:'#0f1929',color:'#e0e6ed',fontFamily:'Rubik',fontSize:17,outline:'none',transition:'border-color .15s'};
  const labelStyle={fontSize:17,color:'#2B1F1C',fontWeight:800,marginBottom:7,display:'block'};

  return <div style={{padding:28,background:'#FAF7F6',minHeight:'calc(100vh - 60px)'}} className="mobile-pad">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
      <h1 style={{fontSize:32,fontWeight:800,color:'#2B1F1C'}}>🎯 צייד מועמדים</h1>
      {searched&&<Btn onClick={reset}>🔄 חיפוש חדש</Btn>}
    </div>

    <div style={{background:'#FFFFFF',borderRadius:16,padding:'24px 28px',marginBottom:24,border:'1px solid #EAE2DF',boxShadow:'0 8px 24px rgba(0,0,0,0.06)'}}>
      <div style={{fontWeight:900,fontSize:18,marginBottom:20,display:'flex',alignItems:'center',gap:8,color:'#2B1F1C'}}>
        <span>🔍</span> הגדר דרישות לצייד
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:18,marginBottom:18}}>
        {(()=>{
          const [dSearch,setDSearch]=React.useState('');
          const [dOpen,setDOpen]=React.useState(false);
          const dFiltered=allDomains.filter(d=>d.includes(dSearch));
          const IS2={...inputStyle,paddingLeft:32,textAlign:'right',direction:'rtl',cursor:'pointer'};
          return <div style={{position:'relative'}}>
            <label style={labelStyle}>תחום מקצועי</label>
            <div style={{position:'relative'}}>
              <input value={domain||dSearch}
                onFocus={()=>{setDOpen(true);if(domain)setDSearch('');}}
                onChange={e=>{setDSearch(e.target.value);setDomain('');setRole('');setDOpen(true);}}
                onBlur={()=>setTimeout(()=>{setDOpen(false);if(!domain)setDSearch('');},160)}
                placeholder="-- כל התחומים --" style={IS2}/>
              <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',pointerEvents:'none',color:'#A79892',fontSize:13}}>▼</span>
            </div>
            {dOpen&&<div style={{position:'absolute',top:'100%',right:0,left:0,background:'#FFFFFF',border:'1.5px solid #EAE2DF',borderRadius:10,zIndex:200,maxHeight:260,overflowY:'auto',boxShadow:'0 8px 24px rgba(0,0,0,0.12)',marginTop:3}}>
              <div onMouseDown={()=>{setDomain('');setDSearch('');setRole('');setDOpen(false);}} className="dd-item dd-placeholder" onMouseEnter={e=>e.currentTarget.style.background='#f3f4f6'} onMouseLeave={e=>e.currentTarget.style.background=''}>-- כל התחומים --</div>
              {dFiltered.length===0&&<div className="dd-item dd-empty">לא נמצאו תוצאות</div>}
              {dFiltered.map(d=><div key={d} onMouseDown={()=>{setDomain(d);setDSearch('');setRole('');setDOpen(false);}}
                className={`dd-item${domain===d?' dd-selected':''}`} onMouseEnter={e=>e.currentTarget.style.background=domain===d?'#fde8dc':'#f3f4f6'} onMouseLeave={e=>e.currentTarget.style.background=domain===d?'#fff5f0':''}>{d}</div>)}
            </div>}
          </div>;
        })()}

        {(()=>{
          const [rSearch,setRSearch]=React.useState('');
          const [rOpen,setROpen]=React.useState(false);
          const rFiltered=allRoles.filter(r=>r.includes(rSearch));
          const IS2={...inputStyle,paddingLeft:32,textAlign:'right',direction:'rtl',cursor:domain?'pointer':'not-allowed',opacity:domain?1:0.45};
          return <div style={{position:'relative'}}>
            <label style={labelStyle}>תפקיד</label>
            <div style={{position:'relative'}}>
              <input value={role||rSearch} disabled={!domain}
                onFocus={()=>{if(domain){setROpen(true);if(role)setRSearch('');}}}
                onChange={e=>{setRSearch(e.target.value);setRole('');setROpen(true);}}
                onBlur={()=>setTimeout(()=>{setROpen(false);if(!role)setRSearch('');},160)}
                placeholder={domain?'-- כל התפקידים --':'בחר תחום תחילה'} style={IS2}/>
              <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',pointerEvents:'none',color:'#A79892',fontSize:13}}>▼</span>
            </div>
            {rOpen&&domain&&<div style={{position:'absolute',top:'100%',right:0,left:0,background:'#FFFFFF',border:'1.5px solid #EAE2DF',borderRadius:10,zIndex:200,maxHeight:260,overflowY:'auto',boxShadow:'0 8px 24px rgba(0,0,0,0.12)',marginTop:3}}>
              <div onMouseDown={()=>{setRole('');setRSearch('');setROpen(false);}} className="dd-item dd-placeholder" onMouseEnter={e=>e.currentTarget.style.background='#f3f4f6'} onMouseLeave={e=>e.currentTarget.style.background=''}>-- כל התפקידים --</div>
              {rFiltered.length===0&&<div className="dd-item dd-empty">לא נמצאו תוצאות</div>}
              {rFiltered.map(r=><div key={r} onMouseDown={()=>{setRole(r);setRSearch('');setROpen(false);}}
                className={`dd-item${role===r?' dd-selected':''}`} onMouseEnter={e=>e.currentTarget.style.background=role===r?'#fde8dc':'#f3f4f6'} onMouseLeave={e=>e.currentTarget.style.background=role===r?'#fff5f0':''}>{r}</div>)}
            </div>}
          </div>;
        })()}

        {(()=>{
          const [cSearch,setCSearch]=React.useState('');
          const [cOpen,setCOpen]=React.useState(false);
          const cFiltered=allCities.filter(cy=>cy.includes(cSearch));
          const IS2={...inputStyle,paddingLeft:32,textAlign:'right',direction:'rtl',cursor:'pointer'};
          return <div style={{position:'relative'}}>
            <label style={labelStyle}>אזור / עיר</label>
            <div style={{position:'relative'}}>
              <input value={city||cSearch}
                onFocus={()=>{setCOpen(true);if(city)setCSearch('');}}
                onChange={e=>{setCSearch(e.target.value);setCity('');setCOpen(true);}}
                onBlur={()=>setTimeout(()=>{setCOpen(false);if(!city)setCSearch('');},160)}
                placeholder="-- כל האזורים --" style={IS2}/>
              <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',pointerEvents:'none',color:'#A79892',fontSize:13}}>▼</span>
            </div>
            {cOpen&&<div style={{position:'absolute',top:'100%',right:0,left:0,background:'#FFFFFF',border:'1.5px solid #EAE2DF',borderRadius:10,zIndex:200,maxHeight:220,overflowY:'auto',boxShadow:'0 8px 24px rgba(0,0,0,0.12)',marginTop:3}}>
              <div onMouseDown={()=>{setCity('');setCSearch('');setCOpen(false);}} className="dd-item dd-placeholder" onMouseEnter={e=>e.currentTarget.style.background='#f3f4f6'} onMouseLeave={e=>e.currentTarget.style.background=''}>-- כל האזורים --</div>
              {cFiltered.length===0&&<div className="dd-item dd-empty">לא נמצאו תוצאות</div>}
              {cFiltered.map(cy=><div key={cy} onMouseDown={()=>{setCity(cy);setCSearch('');setCOpen(false);}}
                className={`dd-item${city===cy?' dd-selected':''}`} onMouseEnter={e=>e.currentTarget.style.background=city===cy?'#fde8dc':'#f3f4f6'} onMouseLeave={e=>e.currentTarget.style.background=city===cy?'#fff5f0':''}>{cy}</div>)}
            </div>}
          </div>;
        })()}
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:18,marginBottom:18}}>
        {(()=>{
          const jobList=data.jobs.map(j=>({id:j.id,label:`${j.jobNumber} — ${j.title}`}));
          const [jSearch,setJSearch]=React.useState('');
          const [jOpen,setJOpen]=React.useState(false);
          const jFiltered=jobList.filter(j=>j.label.includes(jSearch));
          const selLabel=jobList.find(j=>j.id===selJob)?.label||'';
          const IS2={...inputStyle,paddingLeft:32,textAlign:'right',direction:'rtl',cursor:'pointer'};
          return <div style={{position:'relative'}}>
            <label style={labelStyle}>טען ממשרה קיימת</label>
            <div style={{display:'flex',gap:8}}>
              <div style={{position:'relative',flex:1}}>
                <input value={selLabel||jSearch}
                  onFocus={()=>{setJOpen(true);if(selJob)setJSearch('');}}
                  onChange={e=>{setJSearch(e.target.value);setSelJob('');setJOpen(true);}}
                  onBlur={()=>setTimeout(()=>{setJOpen(false);if(!selJob)setJSearch('');},160)}
                  placeholder="-- בחר משרה --" style={IS2}/>
                <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',pointerEvents:'none',color:'#A79892',fontSize:13}}>▼</span>
                {jOpen&&<div style={{position:'absolute',top:'100%',right:0,left:0,background:'#FFFFFF',border:'1.5px solid #EAE2DF',borderRadius:10,zIndex:200,maxHeight:220,overflowY:'auto',boxShadow:'0 8px 24px rgba(0,0,0,0.12)',marginTop:3}}>
                  <div onMouseDown={()=>{setSelJob('');setJSearch('');setJOpen(false);}} className="dd-item dd-placeholder" onMouseEnter={e=>e.currentTarget.style.background='#f3f4f6'} onMouseLeave={e=>e.currentTarget.style.background=''}>-- בחר משרה --</div>
                  {jFiltered.length===0&&<div className="dd-item dd-empty">לא נמצאו תוצאות</div>}
                  {jFiltered.map(j=><div key={j.id} onMouseDown={()=>{setSelJob(j.id);setJSearch('');setJOpen(false);}}
                    className={`dd-item${selJob===j.id?' dd-selected':''}`} onMouseEnter={e=>e.currentTarget.style.background=selJob===j.id?'#fde8dc':'#f3f4f6'} onMouseLeave={e=>e.currentTarget.style.background=selJob===j.id?'#fff5f0':''}>{j.label}</div>)}
                </div>}
              </div>
              <button onClick={loadFromJob} disabled={!selJob}
                style={{padding:'10px 18px',background:selJob?'#DCEEFB':'#EFEAE8',color:selJob?'#1D4FBF':'#A79892',border:'none',borderRadius:9,fontFamily:'Rubik',fontWeight:700,fontSize:16,cursor:selJob?'pointer':'not-allowed',flexShrink:0}}>
                טען
              </button>
            </div>
          </div>;
        })()}

        <div>
          <label style={labelStyle}>🔎 חיפוש חופשי</label>
          <input value={freeText} onChange={e=>setFreeText(e.target.value)}
            placeholder="שם, השכלה, הערות..."
            onKeyDown={e=>e.key==='Enter'&&hunt()}
            style={inputStyle}/>
        </div>
      </div>

      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <button onClick={()=>setIncludeHired(v=>!v)}
            style={{width:40,height:22,borderRadius:11,background:includeHired?'#E98E82':'#EFEAE8',border:'none',cursor:'pointer',position:'relative',transition:'background .2s',flexShrink:0}}>
            <div style={{position:'absolute',top:3,right:includeHired?3:19,width:16,height:16,borderRadius:8,background:'white',transition:'right .2s'}}/>
          </button>
          <span style={{fontSize:17,color:'#2B1F1C',fontWeight:700}}>כולל מועמדים שהושמו בעבר 🏅</span>
        </div>
        <button onClick={hunt}
          style={{padding:'11px 36px',background:'#E98E82',color:'#2B120C',border:'none',borderRadius:10,fontFamily:'Rubik',fontWeight:800,fontSize:18,cursor:'pointer',boxShadow:'0 4px 16px rgba(233,142,130,0.4)'}}>
          🎯 צייד!
        </button>
      </div>
    </div>

    {searched&&results!==null&&(
      <div>
        {results.length===0
          ? <div className="sbox" style={{textAlign:'center',padding:40,color:MUT}}>
              <div style={{fontSize:48,marginBottom:12}}>🔍</div>
              <div style={{fontWeight:700,fontSize:18,marginBottom:6}}>לא נמצאו מועמדים מתאימים</div>
              <div style={{fontSize:15}}>נסה להרחיב את קריטריוני החיפוש</div>
            </div>
          : <>
              <div style={{marginBottom:16,display:'flex',alignItems:'center',gap:12}}>
                <div style={{fontWeight:700,fontSize:18,color:'#2B1F1C'}}>נמצאו <span style={{color:'#E98E82',fontSize:23}}>{results.length}</span> מועמדים</div>
                <div style={{display:'flex',gap:8}}>
                  {high.length>0&&<span style={{background:'#E3F6EC',color:'#0F6B33',border:'1px solid #0F6B3366',borderRadius:20,padding:'3px 10px',fontSize:14,fontWeight:700}}>🟢 {high.length} התאמה גבוהה</span>}
                  {mid.length>0&&<span style={{background:'#FDF1DC',color:'#7A4E08',border:'1px solid #7A4E0866',borderRadius:20,padding:'3px 10px',fontSize:14,fontWeight:700}}>🟡 {mid.length} התאמה חלקית</span>}
                </div>
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:10}}>
                {results.map(c=>{
                  const t=tierLabel[tier(c._score)];
                  const prevJob=c.status==='השמה מוצלחת'?data.jobs.find(j=>c.appliedJobs?.includes(j.id)&&j.status!=='פתוח')||data.jobs.find(j=>c.appliedJobs?.includes(j.id)):null;
                  return <div key={c.id} style={{background:'#FFFFFF',borderRadius:14,padding:'16px 20px',boxShadow:'0 2px 8px rgba(0,0,0,0.06)',border:`1.5px solid ${t.border}`,display:'flex',alignItems:'center',gap:16}}>
                    <div style={{width:52,height:52,borderRadius:26,background:t.bg,border:`3px solid ${t.color}`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                      <div style={{fontWeight:800,fontSize:17,color:t.color}}>{c._score}</div>
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
                        <span style={{fontWeight:800,fontSize:17,color:'#2B1F1C'}}>{c.name}</span>
                        <Tag label={c.status}/>
                        {c.status==='השמה מוצלחת'&&<span style={{fontSize:13,background:'#FDF1DC',color:'#7A4E08',border:'1px solid #7A4E0866',borderRadius:4,padding:'1px 6px',fontWeight:700}}>🏅 הושם</span>}
                        <span style={{fontSize:13,background:t.bg,color:t.color,border:`1px solid ${t.border}`,borderRadius:4,padding:'1px 6px',fontWeight:700}}>{t.label}</span>
                      </div>
                      <div style={{display:'flex',gap:16,fontSize:14,color:MUT,flexWrap:'wrap'}}>
                        {c.domain&&<span>🏷 {c.domain}</span>}
                        {c.role&&<span>👤 {c.role}</span>}
                        {c.city&&<span>📍 {c.city}</span>}
                        {c.experience&&<span>⏱ {c.experience}</span>}
                        {prevJob&&<span style={{color:'#6B5D59',fontWeight:600}}>📌 הושם ב: {prevJob.title}</span>}
                      </div>
                    </div>
                    <div style={{display:'flex',flexDirection:'column',gap:4,minWidth:120}}>

                      ))}
                    </div>
                    <div style={{display:'flex',flexDirection:'column',gap:6,flexShrink:0}}>
                      <button onClick={()=>setMsgTarget(c)}
                        style={{padding:'8px 14px',background:'#DCEEFB',border:'1.5px solid #1D4FBF66',borderRadius:8,fontFamily:'Rubik',fontWeight:700,fontSize:14,cursor:'pointer',color:'#1D4FBF',whiteSpace:'nowrap'}}>
                        ✉️ שלח הצעה
                      </button>
                      {c.phone&&<button onClick={()=>{const p=(c.phone||'').replace(/[-\s]/g,'').replace(/^0/,'972');window.open(`https://wa.me/${p}`,'_blank');}}
                        style={{padding:'8px 14px',background:'#E3F6EC',border:'1.5px solid #0F6B3366',borderRadius:8,fontFamily:'Rubik',fontWeight:700,fontSize:14,cursor:'pointer',color:'#0F6B33',whiteSpace:'nowrap'}}>
                        💬 WhatsApp
                      </button>}
                    </div>
                  </div>;
                })}
              </div>
            </>
        }
      </div>
    )}

    {!searched&&<div style={{textAlign:'center',padding:'28px 0',color:MUT}}>
      <div style={{fontSize:56,marginBottom:12}}>🎯</div>
      <div style={{fontWeight:800,fontSize:21,marginBottom:8,color:'#2B1F1C'}}>מוכן לצייד מועמדים</div>
      <div style={{fontSize:16,color:'#6B5D59'}}>הגדר דרישות למעלה ולחץ "צייד!" כדי למצוא את המועמדים המתאימים ביותר</div>
    </div>}

    {msgTarget&&<MessageModal
      type="candidate"
      person={msgTarget}
      job={data.jobs.find(j=>msgTarget.appliedJobs?.includes(j.id))}
      employer={null}
      candidate={msgTarget}
      onClose={()=>setMsgTarget(null)}
    />}
  </div>;
}

function Settings({data,setData}){
  const [tab,setTab]=React.useState('general');

  const [company,setCompany]=React.useState(()=>data.company||{name:'טופ גרופ גיוס והשמה',email:'mass@topgroup4u.com',phone:''});
  const saveCompany=()=>{setData(d=>({...d,company}));showToast('✅ פרטי החברה נשמרו!','success');};
  // Users tab state
  const [users,setUsers]=React.useState(()=>data.users||[{id:'u1',name:'מנהל מערכת',email:'admin@topgroup4u.com',role:'מנהל',status:'פעיל'}]);

    if(userModal==='add'){const nu={...userForm,id:'u'+Date.now()};setUsers(us=>[...us,nu]);setData(d=>({...d,users:[...users,nu]}));}
    else{const updated=users.map(u=>u.id===userForm.id?userForm:u);setUsers(updated);setData(d=>({...d,users:updated}));}
    setUserModal(null);
  };
  const delUser=id=>{if(!confirm('למחוק משתמש?'))return;const updated=users.filter(u=>u.id!==id);setUsers(updated);setData(d=>({...d,users:updated}));};
  // Statuses tab state
  const defaultStatuses={candidates:['חדש','בתהליך','ראיון נקבע','השמה מוצלחת','נדחה'],jobs:['פתוח','ממתין','סגור'],employers:['פעיל','פסיבי'],jobTypes:['משרה מלאה','חצי משרה','חלקית','משמרות','פרילנס','זמני']};
  const [statuses,setStatuses]=React.useState(()=>({...defaultStatuses,...(data.statuses||{})}));

  const [industries,setIndustries]=React.useState(()=>data.industries||DEFAULT_INDUSTRIES);
  React.useEffect(()=>{if(data.industries)setIndustries(data.industries);},[data.industries]);
  const [newIndustry,setNewIndustry]=React.useState('');
  const addIndustry=()=>{const v=newIndustry.trim();if(!v||industries.includes(v))return;const updated=[...industries,v];setIndustries(updated);setData(d=>({...d,industries:updated,statuses:{...(d.statuses||{}),industries:updated}}));setNewIndustry('');};
  const delIndustry=name=>{if(industries.length<=1)return;const updated=industries.filter(i=>i!==name);setIndustries(updated);setData(d=>({...d,industries:updated,statuses:{...(d.statuses||{}),industries:updated}}));};
  const [newStatus,setNewStatus]=React.useState({candidates:'',jobs:'',employers:'',jobTypes:''});
  const addStatus=(key)=>{const v=(newStatus[key]||'').trim();if(!v)return;const updated={...statuses,[key]:[...(statuses[key]||[]),v]};setStatuses(updated);setData(d=>({...d,statuses:updated}));setNewStatus(n=>({...n,[key]:''}));};
  const delStatus=(key,item)=>{const updated={...statuses,[key]:(statuses[key]||[]).filter(s=>s!==item)};setStatuses(updated);setData(d=>({...d,statuses:updated}));};

  // Display settings — defaults always present, merged with Supabase data
  const DISPLAY_DEFAULTS={zoom:'100',highContrast:false,darkMode:false,boldText:false,accentColor:'#E98E82',colorScheme:'light',userName:'מנהל מערכת'};
  const [display,setDisplay]=React.useState(()=>({...DISPLAY_DEFAULTS,...(data.displaySettings||{})}));
  // Sync display state when data loads from Supabase — always merge with defaults
  React.useEffect(()=>{
    if(data.displaySettings) setDisplay({...DISPLAY_DEFAULTS,...data.displaySettings});
  },[data.displaySettings]);
  const [displaySaved,setDisplaySaved]=React.useState(false);
  const saveDisplay=()=>{
    const saved={...display};
    setData(d=>({...d,displaySettings:saved}));
    const zoomVal=(saved.zoom||'100')+'%';
    localStorage.setItem('crm_zoom',zoomVal);
    localStorage.setItem('crm_accentColor',saved.accentColor||'#E98E82');
    localStorage.setItem('crm_darkMode',saved.darkMode?'1':'0');
    localStorage.setItem('crm_boldText',saved.boldText?'1':'0');
    localStorage.setItem('crm_highContrast',saved.highContrast?'1':'0');
    document.body.style.zoom=zoomVal;
    const filters=[];
    if(saved.darkMode)filters.push('invert(0.92) hue-rotate(183deg)');
    if(saved.highContrast)filters.push('contrast(1.4)');
    document.body.style.filter=filters.join(' ');
    document.documentElement.style.setProperty('--acc',saved.accentColor||'#E98E82');
    document.body.classList.toggle('dark-mode',!!saved.darkMode);
    document.body.classList.toggle('bold-mode',!!saved.boldText);
    setDisplaySaved(true);
    setTimeout(()=>setDisplaySaved(false),3000);
  };

  const [defaults,setDefaults]=React.useState(()=>data.defaults||{employerStatus:'פעיל',jobStatus:'פתוח',candidateStatus:'חדש',yearlyTarget:'',deadlineDays:'7',currency:'₪'});
  React.useEffect(()=>{if(data.defaults)setDefaults(data.defaults);},[data.defaults]);
  const [defaultsSaved,setDefaultsSaved]=React.useState(false);
  const saveDefaults=()=>{const saved={...defaults};setData(d=>({...d,defaults:saved}));setDefaultsSaved(true);setTimeout(()=>setDefaultsSaved(false),3000);};

    <div style={{display:'flex',gap:0,marginBottom:24,borderBottom:'2px solid #EAE2DF',overflowX:'auto'}}>
      {tabs.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{padding:'8px 16px',cursor:'pointer',fontSize:16,fontWeight:600,border:'none',borderBottom:tab===t.id?'3px solid #E98E82':'3px solid transparent',background:'none',color:tab===t.id?'#E98E82':'#6B5D59',marginBottom:-2,whiteSpace:'nowrap'}}>{t.label}</button>)}
    </div>

    {tab==='general'&&<div className="sbox" style={{background:'#141d35',padding:24,maxWidth:560}}>

      <FF label="שם החברה" value={company.name||''} onChange={v=>setCompany(c=>({...c,name:v}))}/>
      <FF label="אימייל ראשי" value={company.email||''} onChange={v=>setCompany(c=>({...c,email:v}))}/>

      <Btn variant="primary" onClick={saveCompany}>שמירת שינויים</Btn>
      <div style={{marginTop:28,borderTop:'2px dashed #EAE2DF',paddingTop:20}}>
        <h3 style={{fontSize:20,fontWeight:700,marginBottom:6,color:'#2B1F1C'}}>📦 גיבוי ושחזור נתונים</h3>
        <div style={{fontSize:15,color:MUT,marginBottom:14}}>ייצא את כל הנתונים לקובץ JSON, ואחר כך ייבא אותו בכל דפדפן או מכשיר.</div>
        <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
          <Btn variant="primary" onClick={()=>{
            const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
            const url=URL.createObjectURL(blob);
            const a=document.createElement('a');
            a.href=url;a.download='topgroup-crm-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url);
          }}>⬇️ ייצא נתונים (JSON)</Btn>
          <label style={{cursor:'pointer',background:'#FFFFFF',color:'#2B1F1C',border:'1.5px solid #EAE2DF',borderRadius:3,padding:'6px 14px',fontSize:16,fontWeight:600}}>
            ⬆️ ייבא נתונים (JSON)
            <input type="file" accept=".json" style={{display:'none'}} onChange={e=>{
              const file=e.target.files[0];if(!file)return;
              const reader=new FileReader();

                try{
                  const parsed=JSON.parse(ev.target.result);
                  if(!parsed.employers||!parsed.jobs||!parsed.candidates){showToast('קובץ לא תקין','error');return;}
                  if(confirm(`ייבא ${parsed.employers.length} מעסיקים, ${parsed.jobs.length} משרות, ${parsed.candidates.length} מועמדים?\nהנתונים הנוכחיים יוחלפו!`)){

        </div>
        <div style={{marginTop:12,padding:12,background:'#DCEEFB',border:'1px dashed #1D4FBF66',borderRadius:4,fontSize:15,color:'#1D4FBF'}}>
          💡 <strong>הנתונים מסונכרנים אוטומטית עם Supabase בענן</strong>
        </div>
      </div>
    </div>}

    {tab==='users'&&<div>

          <thead><tr style={{background:'#FBF8F7',borderBottom:'2px solid #EAE2DF'}}>
            {['שם','אימייל','תפקיד','סטטוס',''].map(h=><th key={h} style={{padding:'10px 12px',textAlign:'right',fontSize:16,fontWeight:700,color:'#6B5D59'}}>{h}</th>)}

        </div>

          <Btn onClick={()=>setUserModal(null)}>ביטול</Btn>
          <Btn variant="primary" onClick={saveUser}>שמירה</Btn>
        </div>
      </Modal>}
    </div>}

    {tab==='domains'&&<DomainsTab data={data} setData={setData}/>}

        </div>
        <div style={{marginTop:12,padding:'10px 14px',background:'#FBF8F7',borderRadius:8,fontSize:15,color:'#6B5D59'}}>

        </div>
      </div>

      <div className="sbox" style={{background:'#141d35',padding:24,marginBottom:16}}>

            <button key={c} onClick={()=>setDisplay(d=>({...d,accentColor:c}))}

function ResetPasswordScreen({onDone}){
  const [password,setPassword]=React.useState('');
  const [confirm,setConfirm]=React.useState('');
  const [loading,setLoading]=React.useState(false);
  const [error,setError]=React.useState('');
  const [success,setSuccess]=React.useState(false);

  const handleReset=async e=>{
    e.preventDefault();
    if(password.length<6){setError('הסיסמה חייבת להכיל לפחות 6 תווים');return;}
    if(password!==confirm){setError('הסיסמאות אינן תואמות');return;}
    setLoading(true);setError('');
    try{
      const {error:err}=await sb.auth.updateUser({password});
      if(err){setError(err.message);setLoading(false);return;}
      setSuccess(true);
      setTimeout(()=>onDone(),2000);
    }catch(e){setError('שגיאה בעדכון הסיסמה');setLoading(false);}
  };

  return <div style={{minHeight:'100vh',background:'#190D0B',display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
    <div style={{width:'100%',maxWidth:400}}>
      <div style={{textAlign:'center',marginBottom:40}}>
        <div style={{fontSize:42,fontWeight:900,color:'#E98E82',lineHeight:1}}>טופ גרופ</div>
        <div style={{fontSize:16,color:'rgba(255,255,255,0.5)',marginTop:6}}>גיוס והשמה · מערכת CRM</div>
      </div>
      <div style={{background:'#FFFFFF',borderRadius:20,padding:'32px 28px',boxShadow:'0 24px 80px rgba(0,0,0,0.25)'}}>
        {success
          ?<div style={{textAlign:'center',padding:'20px 0'}}>
            <div style={{fontSize:56,marginBottom:16}}>✅</div>
            <div style={{fontSize:20,fontWeight:800,color:'#0F6B33',marginBottom:8}}>הסיסמה עודכנה!</div>
            <div style={{fontSize:14,color:'#6B5D59'}}>מועבר למסך הכניסה...</div>
          </div>
          :<form onSubmit={handleReset}>
            <h2 style={{fontSize:22,fontWeight:800,color:'#2B1F1C',marginBottom:4}}>הגדרת סיסמה חדשה</h2>
            <p style={{fontSize:14,color:'#6B5D59',marginBottom:24}}>בחר סיסמה חדשה לחשבון שלך</p>
            <div style={{marginBottom:16}}>
              <label style={{display:'block',fontSize:13,fontWeight:700,color:'#6B5D59',marginBottom:6}}>סיסמה חדשה</label>
              <input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="לפחות 6 תווים"
                style={{width:'100%',padding:'12px 14px',border:'1.5px solid #e5e7eb',borderRadius:10,fontFamily:'Rubik',fontSize:15,outline:'none'}}
                onFocus={e=>e.target.style.borderColor='#e85d26'} onBlur={e=>e.target.style.borderColor='#e5e7eb'}/>
            </div>
            <div style={{marginBottom:20}}>
              <label style={{display:'block',fontSize:13,fontWeight:700,color:'#6B5D59',marginBottom:6}}>אישור סיסמה</label>
              <input type="password" value={confirm} onChange={e=>setConfirm(e.target.value)} placeholder="הכנס שוב את הסיסמה"
                style={{width:'100%',padding:'12px 14px',border:'1.5px solid #e5e7eb',borderRadius:10,fontFamily:'Rubik',fontSize:15,outline:'none'}}
                onFocus={e=>e.target.style.borderColor='#e85d26'} onBlur={e=>e.target.style.borderColor='#e5e7eb'}/>
            </div>
            {error&&<div style={{background:'#FCE4E8',border:'1px solid #A32C5066',borderRadius:8,padding:'10px 14px',fontSize:14,color:'#A32C50',marginBottom:16,textAlign:'center'}}>⚠️ {error}</div>}
            <button type="submit" disabled={loading} style={{width:'100%',padding:'13px',background:loading?'#EFEAE8':'#E98E82',color:loading?'#A79892':'#2B120C',border:'none',borderRadius:10,fontFamily:'Rubik',fontWeight:800,fontSize:16,cursor:loading?'not-allowed':'pointer',boxShadow:loading?'none':'0 4px 16px rgba(233,142,130,0.35)'}}>

// ── APP ───────────────────────────────────────────────────────────────────────
function App(){
  const [session,setSession]=React.useState(null);
  const [authLoading,setAuthLoading]=React.useState(true);

  const [resetMode,setResetMode]=React.useState(false);

  React.useEffect(()=>{
    // Check for password reset token in URL hash
    const hash=window.location.hash;
    if(hash.includes('type=recovery')||hash.includes('access_token')){
      setResetMode(true);
      setAuthLoading(false);
      return;
    }
    sb.auth.getSession().then(({data:{session}})=>{
      setSession(session);
      setAuthLoading(false);
    });
    const {data:{subscription}}=sb.auth.onAuthStateChange((event,session)=>{
      if(event==='PASSWORD_RECOVERY'){setResetMode(true);setAuthLoading(false);return;}
      setSession(session);
      setAuthLoading(false);
    });
    return()=>subscription.unsubscribe();
  },[]);

  if(authLoading) return <div style={{minHeight:'100vh',background:'#190D0B',display:'flex',alignItems:'center',justifyContent:'center'}}>
    <div style={{color:'rgba(255,255,255,0.5)',fontSize:16}}>טוען...</div>
  </div>;

  if(resetMode) return <ResetPasswordScreen onDone={()=>{setResetMode(false);window.location.hash='';}} />;
  if(!session) return <LoginScreen onLogin={s=>setSession(s)}/>;

  return <AppInner/>;
}

function AppInner(){
  const [page,setPageRaw]=React.useState('dashboard');
  const [navTick,setNavTick]=React.useState(0);
  const setPage=p=>{setPageRaw(p);setNavTick(t=>t+1);};
  const [syncStatus,setSyncStatus]=React.useState('syncing');
  const [data,setData]=React.useState(()=>{
    try{
      const saved=localStorage.getItem('crm_data');
      if(!saved)return INIT;
      const p=JSON.parse(saved);
      let nextN=1;
      const jobs=(p.jobs||[]).map(j=>{
        const mj={domain:'',role:'',description:'',requirements:'',benefits:'',image:'',publishTitle:'',...j};
        if(!mj.jobNumber){mj.jobNumber='TG-'+String(nextN).padStart(3,'0');}
        const n=parseInt((mj.jobNumber||'').replace('TG-',''))||0;
        if(n>=nextN)nextN=n+1;
        return mj;
      });
      return{...p,jobs,candidates:(p.candidates||[]).map(c=>({domain:'',...c})),employers:(p.employers||[]).map(e=>({needs:[],...e})),jobDomains:p.jobDomains||INIT.jobDomains};
    }catch{return INIT;}
  });

  // Load from Supabase on startup
  React.useEffect(()=>{
    loadFromSupabase().then(sbData=>{
      if(sbData&&(sbData.employers?.length||sbData.jobs?.length||sbData.candidates?.length||sbData.jobDomains?.length)){
        const jobs=(sbData.jobs||[]).map(j=>({domain:'',role:'',description:'',requirements:'',benefits:'',image:'',publishTitle:'',...j}));
        const merged={
          ...sbData,
          jobs,
          candidates:(sbData.candidates||[]).map(c=>({domain:'',...c})),
          employers:(sbData.employers||[]).map(e=>({needs:[],...e})),
          jobDomains:sbData.jobDomains?.length?sbData.jobDomains:INIT.jobDomains,
          displaySettings:sbData.displaySettings||undefined,
          kpiColors:sbData.kpiColors||undefined,
          commissionBg:sbData.commissionBg||undefined,
          pipelineColors:sbData.pipelineColors||undefined,
          defaults:sbData.defaults||undefined,
        };
        setData(merged);
        localStorage.setItem('crm_data',JSON.stringify(merged));
        setSyncStatus('ok');
      }else{
        const local=JSON.parse(localStorage.getItem('crm_data')||'null');
        saveToSupabase(local||INIT).then(ok=>setSyncStatus(ok?'ok':'error'));
      }
    }).catch(()=>setSyncStatus('error'));
  },[]);

  // Auto-refresh from Supabase every 30 seconds (not 10 — avoid overwriting recent saves)
  const lastSaveTime=React.useRef(0);
  React.useEffect(()=>{
    const interval=setInterval(()=>{
      // Skip refresh if we saved in the last 5 seconds
      if(Date.now()-lastSaveTime.current<5000)return;
      loadFromSupabase().then(sbData=>{
        if(!sbData)return;
        const jobs=(sbData.jobs||[]).map(j=>({domain:'',role:'',description:'',requirements:'',benefits:'',image:'',publishTitle:'',...j}));
        const merged={
          ...sbData,
          jobs,
          candidates:(sbData.candidates||[]).map(c=>({domain:'',...c})),
          employers:(sbData.employers||[]).map(e=>({needs:[],...e})),
          jobDomains:sbData.jobDomains?.length?sbData.jobDomains:INIT.jobDomains,
          displaySettings:sbData.displaySettings||undefined,
          kpiColors:sbData.kpiColors||undefined,
          commissionBg:sbData.commissionBg||undefined,
          pipelineColors:sbData.pipelineColors||undefined,
          defaults:sbData.defaults||undefined,
        };
        setData(merged);
        localStorage.setItem('crm_data',JSON.stringify(merged));
        setSyncStatus('ok');
      }).catch(()=>{});
    },30000);
    return()=>clearInterval(interval);
  },[]);

  // Save to Supabase on data change (debounced 1s)
  // Apply display settings on data change
  React.useEffect(()=>{
    const ds=data.displaySettings||{};
    // Font size is fixed at 1.15rem — not controlled by settings
    document.body.style.filter=ds.highContrast?'contrast(1.25)':'';
    // Apply accent color via CSS variable
    const acc=ds.accentColor||'#E98E82';
    document.documentElement.style.setProperty('--acc',acc);
    // Derive light/dark variants
    document.documentElement.style.setProperty('--acc-light',acc+'22');
    document.documentElement.style.setProperty('--acc-dark',acc);
  },[data.displaySettings]);

  const isFirst=React.useRef(true);
  const saveTimer=React.useRef(null);
  React.useEffect(()=>{
    if(isFirst.current){isFirst.current=false;return;}
    localStorage.setItem('crm_data',JSON.stringify(data));
    setSyncStatus('syncing');
    if(saveTimer.current)clearTimeout(saveTimer.current);
    saveTimer.current=setTimeout(()=>{
      lastSaveTime.current=Date.now();
      saveToSupabase(data).then(ok=>setSyncStatus(ok?'ok':'error'));
    },500);
  },[data]);

  // page intentionally starts at dashboard each session

  const syncBg=syncStatus==='ok'?'#E3F6EC':syncStatus==='error'?'#FCE4E8':'#FDF1DC';
  const syncColor=syncStatus==='ok'?'#0F6B33':syncStatus==='error'?'#A32C50':'#7A4E08';
  const syncMsg=syncStatus==='syncing'?'🔄 מסנכרן...':syncStatus==='ok'?'☁️ מסונכרן עם Supabase':'⚠️ שגיאת סנכרון';

  // Pending candidates (from landing page, await approval)
  const pending=(data.pendingCandidates||[]).map(id=>data.candidates.find(c=>c.id===id)).filter(Boolean);
  const [showPending,setShowPending]=React.useState(false);

  const approvePending=(cid)=>{
    const cand=data.candidates.find(c=>c.id===cid);
    setData(d=>({
      ...d,
      pendingCandidates:(d.pendingCandidates||[]).filter(id=>id!==cid),
      candidates:d.candidates.map(c=>c.id===cid?{...c,pendingApproval:false}:c),
      activityLog:[mkLog('pending','approved',cand?.name||cid),...(d.activityLog||[])].slice(0,50)
    }));
  };
  const [confirmRejectApp,setConfirmRejectApp]=React.useState(null);
  const rejectPending=(cid)=>{
    const cand2=data.candidates.find(c=>c.id===cid);
    setConfirmRejectApp({id:cid,name:cand2?.name||cid});
  };
  const doRejectPending=()=>{
    if(!confirmRejectApp)return;
    const {id:cid}=confirmRejectApp;
    const cand2=data.candidates.find(c=>c.id===cid);
    setData(d=>({
      ...d,
      pendingCandidates:(d.pendingCandidates||[]).filter(id=>id!==cid),
      candidates:d.candidates.filter(c=>c.id!==cid),
      activityLog:[mkLog('pending','rejected',cand2?.name||cid),...(d.activityLog||[])].slice(0,50)
    }));
    setConfirmRejectApp(null);
  };

  // Jump-to-job navigation (from EmployerDetail's job list -> Jobs page)
  const [jumpToJobId,setJumpToJobId]=React.useState(null);

  // Pending jobs (from employer intake form, await approval)
  const pendingJobsList=(data.pendingJobs||[]).map(id=>data.jobs.find(j=>j.id===id)).filter(Boolean);
  const [showPendingJobs,setShowPendingJobs]=React.useState(false);

  const approvePendingJob=(jid)=>{
    const job=data.jobs.find(j=>j.id===jid);
    setData(d=>({
      ...d,
      pendingJobs:(d.pendingJobs||[]).filter(id=>id!==jid),
      jobs:d.jobs.map(j=>j.id===jid?{...j,status:d.defaults?.jobStatus||'פתוח'}:j),
      activityLog:[mkLog('job','approved',job?.publishTitle||job?.title||jid),...(d.activityLog||[])].slice(0,50)
    }));
    showToast('✅ המשרה אושרה ופורסמה','success');
  };
  const [confirmRejectJob,setConfirmRejectJob]=React.useState(null);
  const rejectPendingJob=(jid)=>{
    const job=data.jobs.find(j=>j.id===jid);
    setConfirmRejectJob({id:jid,name:job?.publishTitle||job?.title||jid});
  };
  const doRejectPendingJob=()=>{
    if(!confirmRejectJob)return;
    const {id:jid}=confirmRejectJob;
    const job=data.jobs.find(j=>j.id===jid);
    setData(d=>({
      ...d,
      pendingJobs:(d.pendingJobs||[]).filter(id=>id!==jid),
      jobs:d.jobs.filter(j=>j.id!==jid),
      activityLog:[mkLog('job','rejected',job?.publishTitle||job?.title||jid),...(d.activityLog||[])].slice(0,50)
    }));
    setConfirmRejectJob(null);
  };

  // Dashboard color states — live here so they survive navigation
  const defaultKpiColorsApp=['#1a1a2e','linear-gradient(135deg,#3b82f6,#1d4ed8)','linear-gradient(135deg,#8b5cf6,#6d28d9)','linear-gradient(135deg,#e85d26,#c94d1a)'];
  const defaultPipelineColorsApp=['linear-gradient(135deg,#f3f4f6,#e5e7eb)','linear-gradient(135deg,#dbeafe,#bfdbfe)','linear-gradient(135deg,#fef3c7,#fde68a)','linear-gradient(135deg,#dcfce7,#bbf7d0)'];
  const [kpiColors,setKpiColors]=React.useState(()=>data.kpiColors||defaultKpiColorsApp);
  const [commissionBg,setCommissionBg]=React.useState(()=>data.commissionBg||'linear-gradient(135deg,#1a1a2e 0%,#16213e 100%)');
  const [pipelineColors,setPipelineColors]=React.useState(()=>data.pipelineColors||defaultPipelineColorsApp);
  // Sync from data when it loads from Supabase
  React.useEffect(()=>{
    if(data.kpiColors) setKpiColors(data.kpiColors);
    if(data.commissionBg) setCommissionBg(data.commissionBg);
    if(data.pipelineColors) setPipelineColors(data.pipelineColors);
  },[data.kpiColors,data.commissionBg,data.pipelineColors]);

  return <div style={{display:'flex',flexDirection:'column',height:'100vh',overflow:'hidden',background:'#f0f2f5'}}>
    <div id="desktop-topnav" className="desktop-only"><TopNav active={page} onNav={setPage} pending={pending.length} onPendingClick={()=>setShowPending(true)} pendingJobs={pendingJobsList.length} onPendingJobsClick={()=>setShowPendingJobs(true)}/></div>
    <div id="main-content" style={{flex:1,overflow:'auto',minWidth:0,marginTop:60}}>
      <div style={{background:syncBg,color:syncColor,padding:'3px 14px',fontSize:12,textAlign:'center',borderBottom:'1px solid #EAE2DF'}}>{syncMsg}</div>
      {page==='dashboard'&&<Dashboard data={data} onNav={setPage} setData={setData}
        kpiColors={kpiColors} setKpiColors={setKpiColors}
        commissionBg={commissionBg} setCommissionBg={setCommissionBg}
        pipelineColors={pipelineColors} setPipelineColors={setPipelineColors}
      />}
      {page==='employers'&&<Employers data={data} setData={setData} onOpenJob={jid=>{setJumpToJobId(jid);setPage('jobs');}} navTick={navTick}/>}
      {page==='jobs'&&<Jobs data={data} setData={setData} jumpToJobId={jumpToJobId} clearJumpToJobId={()=>setJumpToJobId(null)} navTick={navTick}/>}
      {page==='candidates'&&<Candidates data={data} setData={setData} navTick={navTick}/>}
      {page==='hunter'&&<CandidateHunter data={data}/>}
      {page==='tasks'&&<Tasks data={data} setData={setData}/>}
      {page==='settings'&&<Settings data={data} setData={setData}/>}
    </div>
    <nav id="mobile-nav">
      {NAV.map(item=>(
        <button key={item.id} className={`mnav-btn${page===item.id?' active':''}`} onClick={()=>setPage(item.id)}>
          <span>{item.icon}</span>
          {item.id==='candidates'&&pending.length>0
            ?<span style={{position:'relative'}}>{item.label}<span style={{position:'absolute',top:-8,left:-6,background:'#E98E82',color:'#2B120C',borderRadius:10,padding:'0 5px',fontSize:9,fontWeight:800}}>{pending.length}</span></span>
            :item.id==='jobs'&&pendingJobsList.length>0
            ?<span style={{position:'relative'}}>{item.label}<span style={{position:'absolute',top:-8,left:-6,background:'#E98E82',color:'#2B120C',borderRadius:10,padding:'0 5px',fontSize:9,fontWeight:800}}>{pendingJobsList.length}</span></span>
            :<span>{item.label}</span>
          }
        </button>
      ))}
    </nav>

    {/* Pending candidates modal */}
    {showPending&&<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',zIndex:999,display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
      <div style={{background:'#FFFFFF',borderRadius:16,width:'100%',maxWidth:620,maxHeight:'85vh',overflow:'auto',boxShadow:'0 20px 60px rgba(0,0,0,0.2)'}}>
        <div style={{padding:'20px 24px',borderBottom:'2px solid #EAE2DF',display:'flex',justifyContent:'space-between',alignItems:'center',position:'sticky',top:0,background:'#FFFFFF'}}>
          <div>
            <h2 style={{fontSize:20,fontWeight:800,color:'#2B1F1C'}}>🔔 מועמדים ממתינים לאישור</h2>
            <div style={{fontSize:13,color:'#6B5D59',marginTop:2}}>מועמדים שהגישו מועמדות דרך דף הנחיתה</div>
          </div>
          <button onClick={()=>setShowPending(false)} style={{background:'none',border:'none',fontSize:22,cursor:'pointer',color:'#6B5D59'}}>✕</button>
        </div>
        <div style={{padding:16}}>
          {pending.length===0
            ?<div style={{textAlign:'center',padding:40,color:'#A79892'}}>אין מועמדים ממתינים</div>
            :pending.map(c=>{
              const job=data.jobs.find(j=>c.appliedJobs?.includes(j.id));
              return <div key={c.id} style={{border:'2px solid #EAE2DF',borderRadius:12,padding:16,marginBottom:12,background:'#FBF8F7'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
                  <div style={{display:'flex',gap:10,alignItems:'center'}}>
                    <div style={{width:44,height:44,borderRadius:22,background:'#E98E82',color:'#2B120C',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,fontSize:17,flexShrink:0}}>
                      {c.name.charAt(0)}
                    </div>
                    <div>
                      <div style={{fontWeight:800,fontSize:16,color:'#2B1F1C'}}>{c.name}</div>
                      <div style={{fontSize:13,color:'#6B5D59'}}>{c.role||c.domain}</div>
                    </div>
                  </div>
                  <div style={{fontSize:11,color:'#A79892',textAlign:'left'}}>
                    {c.appliedAt?new Date(c.appliedAt).toLocaleString('he-IL',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'}):''}
                  </div>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6,fontSize:13,color:'#6B5D59',marginBottom:12}}>
                  {c.phone&&<span>📞 {c.phone}</span>}
                  {c.email&&<span>✉️ {c.email}</span>}
                  {c.city&&<span>📍 {c.city}</span>}
                  {c.experience&&<span>⏱ {c.experience}</span>}
                  {c.education&&<span>🎓 {c.education}</span>}
                  {c.cv&&<span style={{color:'#0F6B33',fontWeight:600}}>📄 CV מצורף</span>}
                </div>
                {job&&<div style={{fontSize:12,background:'#DCEEFB',border:'1px solid #1D4FBF66',borderRadius:6,padding:'5px 10px',marginBottom:10,color:'#1D4FBF',fontWeight:600}}>
                  🔗 משרה: {job.publishTitle||job.title} ({job.jobNumber})
                </div>}
                {c.notes&&<div style={{fontSize:13,color:'#6B5D59',background:'#FBF8F7',borderRadius:6,padding:'8px 10px',marginBottom:10,fontStyle:'italic'}}>"{c.notes}"</div>}
                <div style={{display:'flex',gap:10}}>
                  <button onClick={()=>approvePending(c.id)} style={{flex:1,padding:'9px 0',background:'#0F6B33',color:'#FFFFFF',border:'none',borderRadius:8,fontFamily:'Rubik',fontWeight:700,fontSize:14,cursor:'pointer'}}>
                    ✅ אשר והוסף למועמדים
                  </button>
                  <button onClick={()=>rejectPending(c.id)} style={{padding:'9px 16px',background:'#FCE4E8',color:'#A32C50',border:'none',borderRadius:8,fontFamily:'Rubik',fontWeight:700,fontSize:14,cursor:'pointer'}}>
                    ✕ דחה
                  </button>
                </div>
              </div>;
            })
          }
        </div>
      </div>
    </div>}

    {/* Pending jobs modal */}
    {showPendingJobs&&<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',zIndex:999,display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
      <div style={{background:'#FFFFFF',borderRadius:16,width:'100%',maxWidth:620,maxHeight:'85vh',overflow:'auto',boxShadow:'0 20px 60px rgba(0,0,0,0.2)'}}>
        <div style={{padding:'20px 24px',borderBottom:'2px solid #EAE2DF',display:'flex',justifyContent:'space-between',alignItems:'center',position:'sticky',top:0,background:'#FFFFFF'}}>
          <div>
            <h2 style={{fontSize:20,fontWeight:800,color:'#2B1F1C'}}>📋 משרות ממתינות לאישור</h2>
            <div style={{fontSize:13,color:'#6B5D59',marginTop:2}}>משרות שהוגשו ע"י מעסיקים דרך טופס דרישות המשרה</div>
          </div>
          <button onClick={()=>setShowPendingJobs(false)} style={{background:'none',border:'none',fontSize:22,cursor:'pointer',color:'#6B5D59'}}>✕</button>
        </div>
        <div style={{padding:16}}>
          {pendingJobsList.length===0
            ?<div style={{textAlign:'center',padding:40,color:'#A79892'}}>אין משרות ממתינות</div>
            :pendingJobsList.map(j=>{
              const emp=data.employers.find(e=>e.id===j.employerId);
              return <div key={j.id} style={{border:'2px solid #EAE2DF',borderRadius:12,padding:16,marginBottom:12,background:'#FBF8F7'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
                  <div>
                    <div style={{fontWeight:800,fontSize:16,color:'#2B1F1C'}}>{j.publishTitle||j.title}</div>
                    <div style={{fontSize:13,color:'#6B5D59'}}>{j.jobNumber}{emp?' · '+emp.name:''}</div>
                  </div>
                  <div style={{fontSize:11,color:'#A79892',textAlign:'left'}}>
                    {j.submittedAt?new Date(j.submittedAt).toLocaleString('he-IL',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'}):''}
                  </div>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6,fontSize:13,color:'#6B5D59',marginBottom:12}}>
                  {j.domain&&<span>🏷 {j.domain}</span>}
                  {j.type&&<span>💼 {j.type}</span>}
                  {j.location&&<span>📍 {j.location}</span>}
                  {j.salary&&<span>💰 {j.salary}</span>}
                  {j.positions&&<span>👥 {j.positions} משרות</span>}
                  {j.contactName&&<span>👤 {j.contactName}{j.contactPhone?' · '+j.contactPhone:''}</span>}
                </div>
                {j.description&&<div style={{fontSize:13,color:'#6B5D59',background:'#FBF8F7',borderRadius:6,padding:'8px 10px',marginBottom:8,whiteSpace:'pre-line'}}><strong>תיאור:</strong> {j.description}</div>}
                {j.requirements&&<div style={{fontSize:13,color:'#6B5D59',background:'#FBF8F7',borderRadius:6,padding:'8px 10px',marginBottom:10,whiteSpace:'pre-line'}}><strong>דרישות:</strong> {j.requirements}</div>}
                <div style={{display:'flex',gap:10}}>
                  <button onClick={()=>approvePendingJob(j.id)} style={{flex:1,padding:'9px 0',background:'#0F6B33',color:'#FFFFFF',border:'none',borderRadius:8,fontFamily:'Rubik',fontWeight:700,fontSize:14,cursor:'pointer'}}>
                    ✅ אשר ופרסם
                  </button>
                  <button onClick={()=>rejectPendingJob(j.id)} style={{padding:'9px 16px',background:'#FCE4E8',color:'#A32C50',border:'none',borderRadius:8,fontFamily:'Rubik',fontWeight:700,fontSize:14,cursor:'pointer'}}>
                    ✕ דחה
                  </button>
                </div>
              </div>;
            })
          }
        </div>
      </div>
    </div>}

    <ConfirmDialog
      open={!!confirmRejectApp}
      title="דחיית מועמד בהמתנה"
      message="האם אתה בטוח שברצונך לדחות את המועמד:"
      name={confirmRejectApp?.name}
      onConfirm={doRejectPending}
      onCancel={()=>setConfirmRejectApp(null)}
    />
    <ConfirmDialog
      open={!!confirmRejectJob}
      title="דחיית משרה ממתינה"
      message="האם אתה בטוח שברצונך לדחות את המשרה:"
      name={confirmRejectJob?.name}
      onConfirm={doRejectPendingJob}
      onCancel={()=>setConfirmRejectJob(null)}
    />
    <ToastContainer/>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
